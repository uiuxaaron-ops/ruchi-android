.nsep{width:1px;height:32px;margin:0 var(--s1);background:#3F3F46}
.nadd{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:20px;background:#FF3E9A;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .12s}
.nadd svg{width:24px;height:24px;transition:transform .3s}
.nadd:hover svg{transform:rotate(90deg)}
.nadd:active{transform:scale(.92)}
/* map overlays */
#cards{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.chips{-webkit-mask:linear-gradient(90deg,#000 85%,transparent);mask:linear-gradient(90deg,#000 85%,transparent)}
#top .setup-pill{position:static;pointer-events:auto;margin-top:-4px;box-shadow:var(--float)}
.zoom{top:208px}
.toast{top:auto;bottom:calc(248px + env(safe-area-inset-bottom,0px));border-radius:16px;padding:var(--s3) var(--s4);box-shadow:0 12px 32px rgba(9,9,11,.24);width:max-content}
.toast.show{transform:translateX(-50%) translateY(0)}
#app.onpage .toast{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.scard{box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(9,9,11,.08)}
.scard b{font-family:var(--font-serif);font-weight:500;font-size:18px;line-height:24px}
/* pages */
.page{padding:0 0 calc(120px + env(safe-area-inset-bottom,0px))}
.ptop{position:sticky;top:0;z-index:5;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) var(--gutter) 0;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ptop b{text-align:center;font-size:15px;line-height:20px;font-weight:600}
.pbtn{justify-self:end;height:var(--h-sm,32px);padding:0 var(--s3);border-radius:var(--r-full);background:var(--surface);font-weight:600;font-size:13px}
.pwrap{max-width:560px;margin:0 auto;padding:var(--s6) var(--gutter) 0}
.page h1{text-align:center}
.page .lead{text-align:center;font-size:15px;margin-top:var(--s2)}
.phero{text-align:center}
.pic{width:80px;height:80px;margin:0 auto var(--s4);display:grid;place-items:center;border-radius:24px}
.pic .px{width:56px;height:56px;animation:float 3.5s ease-in-out infinite}
.pic.sm{width:44px;height:44px;margin:0;border-radius:14px;flex:none}
.pic.sm .px{width:32px;height:32px;animation:none}
.t-or{background:#FFEBDD}.t-pk{background:#FFE4F1}.t-gr{background:#E3F7DD}.t-bl{background:#E4ECFF}
.howpts{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s5)}
.howpts span{height:32px;padding:0 var(--s3) 0 var(--s2);display:inline-flex;align-items:center;gap:var(--s1);border-radius:var(--r-full);background:var(--surface);font-size:12px;color:var(--mute)}
.howpts .px{width:20px;height:20px}.howpts b{color:var(--ink)}
.mycard{display:flex;gap:var(--s4);align-items:center;margin-top:var(--s6);padding:var(--s4);border-radius:var(--r-lg);background:var(--p1);color:#fff}
.mav{width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden;background:#27272A;box-shadow:0 0 0 3px #3F3F46}
.mav .avimg,.lav .avimg,.pav .avimg{width:100%;height:100%}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
.mt small{color:#A1A1AA;font-size:12px;line-height:16px}
.mt b{font-family:var(--font-serif);font-weight:500;font-size:20px;line-height:24px}
.mbar{height:8px;border-radius:var(--r-full);background:rgba(127,127,127,.25);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,#FF3E9A,#FF7A1A);animation:grow 1s .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes grow{from{width:0!important}}
.emptyc{margin-top:var(--s6);padding:var(--s6) var(--s5) var(--s5);border-radius:var(--r-lg);background:var(--surface);text-align:center}
.emptyc .pic{width:72px;height:72px;background:#fff}
.emptyc b{display:block;font-family:var(--font-serif);font-weight:500;font-size:22px;line-height:28px}
.emptyc p{margin:var(--s2) 0 var(--s5);color:var(--mute);font-size:14px;line-height:20px}
.emptyc .bigbtn{width:100%}
.podium2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s2);align-items:end;margin-top:var(--s6)}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pav{position:relative;width:56px;height:56px;border-radius:50%;overflow:visible;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--line)}
.pav .avimg{border-radius:50%}
.r1 .pav{width:72px;height:72px;box-shadow:0 0 0 3px #fff,0 0 0 5px #FF3E9A}
.crown{position:absolute;top:-18px;right:-10px;animation:float 2.5s ease-in-out infinite}.crown .px{width:32px;height:32px}
.pd b{margin-top:var(--s2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:20px}
.pd small{color:var(--mute);font-size:12px;line-height:16px}

/* ===== Liquid glass system ===== */
:root{--r-sm:14px;--r-md:20px;--r-lg:28px;--r-xl:36px;
  --glass-bg:rgba(255,255,255,.52);
  --glass-fx:blur(18px) saturate(190%) brightness(1.06);
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.5),0 0 0 .5px rgba(9,9,11,.10),0 10px 30px rgba(9,9,11,.12),0 2px 6px rgba(9,9,11,.05)}
.glass,.hello,.search,.chip{position:relative}
.glass,.hello,.search,.chip,.zoom,#top .setup-pill,#top #status,#sresults,.push,#addbar,.ptop{background:var(--glass-bg);backdrop-filter:var(--glass-fx);-webkit-backdrop-filter:var(--glass-fx);box-shadow:var(--glass-edge)}
.glass::after,.hello::after,.search::after,.zoom::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%),radial-gradient(120% 80% at 15% 0%,rgba(255,255,255,.35),transparent 60%);mix-blend-mode:soft-light}
.chip.on,.chips .on{background:rgba(9,9,11,.86);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px rgba(9,9,11,.2)}
#top .setup-pill{color:var(--ink)}
.me-chip{background:rgba(9,9,11,.86);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.bell{background:rgba(255,255,255,.6)}
.ptop{border-bottom:0;box-shadow:0 .5px 0 rgba(9,9,11,.08)}
/* tab bar */
#nav{left:50%;right:auto;width:min(calc(100% - 32px),420px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:auto}
.nbar{display:none}
.lgbar{flex:1;height:64px;display:flex;align-items:center;padding:4px;border-radius:999px;touch-action:none;transition:flex .4s cubic-bezier(.3,1.25,.4,1),transform .2s}
.lgbar.press{transform:scale(1.02)}
.lgbar button{position:relative;z-index:1;flex:1;min-width:0;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:999px;color:#52525B;background:none;transition:flex .4s cubic-bezier(.3,1.25,.4,1),opacity .25s,color .2s}
.lgbar .ni{width:28px;height:28px;display:grid;place-items:center;opacity:.7;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.lgbar .ni .px{width:28px;height:28px}
.lgbar .nav-av{border-radius:50%;overflow:hidden;background:rgba(255,255,255,.7)}
.lgbar .nav-av .avimg{width:100%;height:100%}
.lgbar .nl{font-size:11px;line-height:14px;font-weight:600;transition:opacity .2s}
.lgbar button.on{color:var(--ink)}
.lgbar button.on .ni{opacity:1}
.lgbar button.on .nav-av{box-shadow:0 0 0 2px var(--ink)}
.lgbar button.hov .ni{transform:scale(1.15)}
.lgbar .hop2 .ni{animation:hopIc .5s cubic-bezier(.3,1.6,.5,1)}
.lgbub{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:80px;border-radius:999px;background:rgba(120,120,128,.16);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.8),0 4px 14px rgba(9,9,11,.10);transition:left .42s cubic-bezier(.3,1.35,.4,1),width .42s cubic-bezier(.3,1.35,.4,1),transform .25s cubic-bezier(.3,1.5,.5,1),background .2s}
.lgbub.stretch{transition:left .17s ease-out,width .17s ease-out,transform .17s;transform:scaleY(.86)}
.lgbub.lift{transform:scale(1.18);background:rgba(255,255,255,.35);backdrop-filter:blur(2px) saturate(220%) brightness(1.12);-webkit-backdrop-filter:blur(2px) saturate(220%) brightness(1.12);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1.5px rgba(255,255,255,.95),inset 0 -6px 12px rgba(255,255,255,.4),0 10px 28px rgba(9,9,11,.18)}
.lgadd{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.lgadd.tint{background:rgba(9,9,11,.82);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12),0 10px 28px rgba(9,9,11,.28)}
.lgadd svg{width:26px;height:26px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.lgadd:hover svg{transform:rotate(90deg)}
.lgadd:active{transform:scale(.88)}
/* minimised on scroll */
#nav.mini .lgbar{flex:0 0 64px}
#nav.mini .lgbar button:not(.on){flex:0;opacity:0;pointer-events:none;overflow:hidden}
#nav.mini .lgbar .nl{opacity:0}
#nav.mini{justify-content:space-between;width:calc(100% - 32px);max-width:560px}
/* sheets: inset, all-corners, like iOS 26 */
@media (max-width:899px){.sheet{bottom:8px;width:calc(100% - 16px);max-width:560px;max-height:calc(100% - 24px);border-radius:var(--r-xl)}}
/* continuous (squircle) corners where supported */
@supports (corner-shape:squircle){
  .scard,.sheet,.emptyc,.mycard,.lvcard,.stat3>div,.todo,.lb,.rc,.lad,.pic,.lav.sq,.doc,.signbox,.heat,.hs,.tcard,.av3-panel,.seg5,.mission,.bigbtn,.btn,.th,.blk,#addbar,#sresults,.push,.clause,.welcome .card,.tsearch,.lgadd.sq{corner-shape:squircle}
  .scard,.emptyc,.mycard,.lvcard,.heat,.hs,.doc,.signbox,.tcard,.lb,.mission{border-radius:36px}
  .sheet{border-radius:44px}
  .bigbtn,.btn{border-radius:24px}
  .pic{border-radius:32px}.pic.sm{border-radius:18px}
  .th,.lav.sq{border-radius:20px}
  .stat3>div,.todo,.rc,.clause{border-radius:28px}
}

.al-ic{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:16px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}.al-ic .px{width:32px;height:32px}
.al-row:hover .al-ic,.al-row:active .al-ic{transform:rotate(-8deg) scale(1.08)}
.al-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.al-tx b{font-size:15px;line-height:20px;font-weight:600}.al-tx small{font-size:13px;line-height:18px;color:var(--mute)}
.al-ar{width:20px;height:20px;flex:none;color:#A1A1AA;transition:transform .2s}.al-row:hover .al-ar{transform:translateX(3px);color:var(--ink)}
.al-chips{margin-top:var(--s4)}.al-chips button{animation:enterUp .35s calc(.6s + var(--i)*.04s) both;transition:transform .15s,background .15s}.al-chips button:active{transform:scale(.94)}
.al-saved{display:flex;gap:var(--s3);overflow-x:auto;margin:0 calc(-1*var(--gutter));padding:0 var(--gutter) var(--s1);scrollbar-width:none}
.al-sp{flex:0 0 168px;display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);padding:var(--s4);border:0;border-radius:24px;background:#fff;box-shadow:0 0 0 1px #EFEFF1;text-align:left;font:inherit;color:var(--ink)}
.al-spn{display:flex;align-items:baseline;gap:4px;font-family:var(--font-serif);font-size:28px;line-height:32px;color:#8B5CF6}.al-spn small{font-family:var(--font-ui);font-size:12px;color:var(--mute)}
.al-sp b{font-size:14px;line-height:20px;font-weight:600}.al-sp>small{font-size:12px;color:var(--mute)}
/* bar: mic/send/stop morph */
.ask-go svg{animation:goIn .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes goIn{from{transform:scale(.4) rotate(-30deg);opacity:0}}
.ask-go.m-mic{background:var(--p1)}
.ask-go.m-stop::after{content:"";width:16px;height:16px;border-radius:4px;background:#fff;animation:goIn .25s}
.ask-go.m-stop{box-shadow:0 0 0 0 rgba(9,9,11,.25);animation:stopPulse 1.4s infinite}
@keyframes stopPulse{70%{box-shadow:0 0 0 12px rgba(9,9,11,0)}}
/* voice mode */
#app.voicing #page-ask .pwrap{filter:blur(6px);opacity:.35;transition:filter .3s,opacity .3s;pointer-events:none}
#app.voicing #askbar{flex-direction:column;align-items:stretch;gap:var(--s3)}
.vtxt{max-height:40vh;overflow-y:auto;padding:var(--s4) var(--s5);border-radius:28px;animation:vIn .35s cubic-bezier(.3,1.3,.5,1) both}
.vtxt small{display:flex;align-items:center;gap:var(--s2);font-size:12px;line-height:16px;font-weight:600;color:#7C3AED}
.vdot{width:8px;height:8px;border-radius:50%;background:#FF3E9A;animation:vdot 1s ease-in-out infinite}
@keyframes vdot{50%{transform:scale(1.6);opacity:.5}}
.vtxt p{margin:var(--s2) 0 0;font-family:var(--font-serif);font-size:22px;line-height:30px;font-weight:500;color:var(--ink);word-wrap:break-word}
.vpa{color:#A1A1AA}.vph{color:#A1A1AA}
.vbar{display:flex;align-items:center;gap:var(--s2);animation:vIn .3s .05s cubic-bezier(.3,1.3,.5,1) both}
@keyframes vIn{from{transform:translateY(16px) scale(.96);opacity:0}}
.v-x,.v-ok{width:56px;height:56px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;transition:transform .15s}
.v-x{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 8px 24px rgba(9,9,11,.08)}
.v-ok{background:var(--p1);color:#fff;box-shadow:0 8px 24px rgba(9,9,11,.2)}
.v-x:active,.v-ok:active{transform:scale(.9)}.v-x svg,.v-ok svg{width:24px;height:24px}
.v-ok.go svg{animation:okGo .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes okGo{50%{transform:scale(1.35)}}
.vwave{flex:1;height:56px;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 var(--s4);border-radius:999px;overflow:hidden}
.vwave i{width:3px;height:calc(var(--h)*40%);border-radius:2px;background:#8B5CF6;opacity:.55;animation:wv .9s calc(var(--i)*-.07s) ease-in-out infinite alternate;transition:opacity .2s}
.vwave i:nth-child(3n){background:#FF3E9A}.vwave i:nth-child(5n){background:#14B8A6}
.vwave.talk i{opacity:1;animation-duration:.35s}
@keyframes wv{from{transform:scaleY(.35)}to{transform:scaleY(1.3)}}

/* Ask opened from header icon */
.hrow .askbtn{margin-left:auto}
.hrow .askbtn+.bell{margin-left:0}
.askbtn .askic{width:26px;height:26px}
.askbtn{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}.askbtn:active{transform:scale(.88)}
#app.onask #nav{display:none}
#app.onask #askbar{bottom:calc(var(--s4) + env(safe-area-inset-bottom,0px))}
.askp{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;animation:askUp .35s cubic-bezier(.2,.9,.25,1)}
#app.onask #askbar{z-index:31}
@keyframes askUp{from{transform:translateY(24px);opacity:0}}
.askt .sv-back{justify-self:start}
.askt .ask-new{justify-self:end}


/* ===== Ask v3: answers ===== */
.askt{background:#fff!important;backdrop-filter:none!important;padding-inline:max(var(--gutter),calc((100% - 560px)/2))!important}
.ask-th{gap:var(--s6)!important;padding-top:var(--s2)}
.am.u{align-self:flex-end;max-width:84%}
.am.u p{margin:0;padding:var(--s3) var(--s4);border-radius:22px 22px 6px 22px;background:var(--p1);color:#fff;font-size:15px;line-height:22px}
.am.u.fresh{animation:bubIn .35s cubic-bezier(.3,1.4,.5,1) both;transform-origin:100% 100%}
@keyframes bubIn{from{transform:scale(.6) translateY(8px);opacity:0}}
.am.a{display:flex;flex-direction:column;gap:var(--s3)}
.am-h{display:flex;align-items:center;gap:var(--s2)}
.am-av{width:32px;height:32px;padding:5px;border-radius:12px;background:#EFE8FF;flex:none}
.am-av.spin .askic{animation:spinStep 1.2s steps(4) infinite}
@keyframes spinStep{to{transform:rotate(360deg)}}
.am-h b{font-size:14px;line-height:20px;font-weight:600}
.am-say{margin:0;font-size:16px;line-height:24px;color:var(--ink)}
.am.fresh .am-h{animation:enterUp .3s both}
.wd{display:inline-block;animation:wdIn .35s calc(var(--w)*22ms) both}
@keyframes wdIn{from{opacity:0;transform:translateY(6px);filter:blur(3px)}}
.shim{background:linear-gradient(90deg,#A1A1AA 0,#18181B 45%,#A1A1AA 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.sk{display:flex;flex-direction:column;gap:var(--s2)}
.sk-c{display:flex;align-items:center;gap:var(--s3);padding:var(--s2);border-radius:24px;box-shadow:0 0 0 1px #EFEFF1;animation:enterUp .3s calc(var(--i)*.1s) both}
.sk-c span{flex:1;display:flex;flex-direction:column;gap:8px}
.sk-im,.sk-c span i{display:block;border-radius:10px;background:linear-gradient(90deg,#F4F4F5 0,#E9E9EC 40%,#F4F4F5 80%);background-size:300% 100%;animation:skm 1.2s linear infinite}
.sk-im{width:80px;height:80px;flex:none;border-radius:18px}
.sk-c span i{height:12px}.sk-c span i:nth-child(1){width:60%;height:16px}.sk-c span i:nth-child(2){width:40%}.sk-c span i:nth-child(3){width:80%}
/* result card */
.akcl{display:flex;flex-direction:column;gap:var(--s2)}
.akc{position:relative;display:flex;align-items:center;gap:var(--s3);width:100%;min-height:96px;padding:var(--s2) var(--s3) var(--s2) var(--s2);border:0;border-radius:24px;background:#fff;box-shadow:0 0 0 1px #EFEFF1,0 4px 16px rgba(9,9,11,.04);text-align:left;font:inherit;color:var(--ink);transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .2s}
.fresh .akc{animation:rcIn .45s calc(.15s + var(--i)*.08s) cubic-bezier(.2,1.2,.4,1) both}
@keyframes rcIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.akc:hover{box-shadow:0 0 0 1px #E4E4E7,0 10px 28px rgba(9,9,11,.08)}
.akc:active,.akc.tapd{transform:scale(.97)}
.akc.top{box-shadow:0 0 0 1.5px #C4B5FD,0 8px 24px rgba(139,92,246,.12)}
.akc-img{width:80px;height:80px;flex:none;display:grid;place-items:center;border-radius:18px;overflow:hidden}
.akc-img img:not(.px){width:100%;height:100%;object-fit:cover}
.akc-img .px{width:48px!important;height:48px!important;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.akc:hover .akc-img .px{transform:rotate(-6deg) scale(1.08)}
.akc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.akc-top{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px 0 4px;border-radius:999px;background:#EFE8FF;color:#6D28D9;font-size:11px;line-height:16px;font-weight:600}.akc-top .px{width:16px;height:16px}
.akc-n{font-family:var(--font-serif);font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.akc-m{display:flex;align-items:center;gap:var(--s2);font-size:13px;line-height:16px;flex-wrap:nowrap;min-width:0}
.akc-m .rbadge{height:22px;flex:none}.akc-m .rbadge b{font-size:13px;line-height:22px}
.akc-km{font-weight:600;flex:none}
.akc-cat,.akc-gem{display:inline-flex;align-items:center;gap:3px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.akc-gem{color:#BE185D;font-weight:600}.akc-gem .px{width:16px;height:16px}
.akc-km::after{content:"";display:inline-block;width:3px;height:3px;margin:0 0 3px var(--s2);border-radius:50%;background:#D4D4D8}
.akc-why{font-size:13px;line-height:18px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.akc-go{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:#F4F4F5;color:#71717A;transition:transform .2s,background .2s,color .2s}.akc-go svg{width:16px;height:16px}
.akc:hover .akc-go{transform:translateX(2px);background:var(--p1);color:#fff}
/* plan */
.plan{display:flex;flex-direction:column;gap:var(--s4);padding-top:var(--s1)}
.plan-h{display:flex;align-items:center;gap:var(--s3)}
.plan-ic{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:16px;background:#FFEBDD}.plan-ic .px{width:32px;height:32px}
.plan-h>span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.plan-h b{font-family:var(--font-serif);font-size:20px;line-height:24px;font-weight:600}
.plan-h small{font-size:13px;line-height:18px;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}
.tl-i{position:relative;display:flex;gap:var(--s3);padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:13px;top:32px;bottom:-4px;border-left:2px dashed #D9CCFF}
.tl-i:last-child::before{display:none}
.tl-dot{position:relative;z-index:1;width:28px;height:28px;flex:none;margin-top:0;display:grid;place-items:center;border-radius:50%;background:#8B5CF6;color:#fff;font:700 13px/1 var(--font-ui);box-shadow:0 0 0 4px #fff}
.fresh .tl-dot{animation:dotPop .4s calc(.2s + var(--i)*.12s) cubic-bezier(.3,1.8,.5,1) both}
@keyframes dotPop{from{transform:scale(0)}}
.tl-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2);padding-bottom:var(--s2)}
.tl-time{font-size:13px;line-height:28px;font-weight:600;color:#6D28D9}
.leg{display:flex;align-items:center;gap:var(--s2);height:32px;font-size:12px;line-height:16px;color:var(--mute)}
.leg .px{width:20px;height:20px}
.fresh .leg .px{animation:rideIn .6s calc(.4s + var(--i,0)*.12s) ease-out both}
@keyframes rideIn{from{transform:translateX(-12px);opacity:0}}
.plan-a{display:flex;gap:var(--s2);margin-top:var(--s1)}
.pa{height:48px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:0 var(--s5);border:0;border-radius:999px;background:#F4F4F5;font:600 15px/20px var(--font-ui);color:var(--ink);white-space:nowrap;transition:transform .15s}
.pa:active{transform:scale(.95)}
.pa.main{flex:1;min-width:0;background:var(--p1);color:#fff}.pa .px{width:24px;height:24px}
.pa.solo{flex:none;width:100%;margin-top:var(--s1)}
.fresh .pa.solo{animation:enterUp .35s calc(.25s + var(--i)*.08s) both}
.pa.ic{width:48px;padding:0;flex:none}.pa.ic svg{width:22px;height:22px}
.pa.ic.on{color:#8B5CF6;background:#EFE8FF}.pa.ic.pop svg{animation:okGo .45s cubic-bezier(.3,1.6,.5,1)}
.fu{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s1)}
.fu button{height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 var(--s4) 0 var(--s3);border:1px solid #E4DAFE;border-radius:999px;background:#FAF7FF;font:500 14px/20px var(--font-ui);color:var(--ink);animation:enterUp .35s calc(.5s + var(--i)*.07s) both;transition:transform .15s,background .15s}
.fu button:active{transform:scale(.94)}.fu button:hover{background:#EFE8FF}
.fu .askic{width:16px;height:16px}
@supports (corner-shape:squircle){.akc{corner-shape:squircle;border-radius:32px}.akc-img{corner-shape:squircle;border-radius:24px}.am.u p{corner-shape:round}}
@media (max-width:420px){.akc-go{display:none}.akc{padding-right:var(--s4)}}

/* ===== Skeletons ===== */
.skl{display:block;flex:none;border-radius:12px;background:linear-gradient(100deg,#F1F1F3 20%,#FAFAFB 40%,#F1F1F3 60%);background-size:300% 100%;animation:skm 1.4s linear infinite}
.pc.skc{cursor:default;pointer-events:none;animation:enterUp .35s both}
.pc.skc .pc-img{background:linear-gradient(100deg,#F1F1F3 20%,#FAFAFB 40%,#F1F1F3 60%)!important;background-size:300% 100%!important}
.skc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s1) 0}
.skli{display:flex;flex-direction:column;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px #EFEFF1;margin-bottom:var(--s4);animation:enterUp .35s calc(var(--i)*.06s) both}
.skli-im{width:100%;height:168px;border-radius:0}
.skli-b{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4) var(--s5) var(--s5)}
.skrows{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) 0}
.sv .skrows{padding:var(--s4) var(--gutter)}
.skr{display:flex;align-items:center;gap:var(--s3);padding:var(--s2);border-radius:20px;animation:enterUp .35s calc(var(--i)*.05s) both}
.skr>div{flex:1;display:flex;flex-direction:column;gap:var(--s2)}
.sk-page{display:flex;flex-direction:column;gap:var(--s4)}
.sk-hero{display:flex;flex-direction:column;align-items:center;gap:var(--s3);padding:var(--s4) 0}
.sk-ch{display:flex;gap:var(--s2)}
.sk-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.sk-sec{margin-top:var(--s2)}
.sk-rv{display:flex;flex-direction:column;gap:var(--s3)}
/* map loading pill */
#mapload{position:absolute;left:50%;top:46%;z-index:9;display:none;align-items:center;gap:var(--s2);height:48px;padding:0 var(--s5) 0 var(--s3);border-radius:999px;transform:translate(-50%,-50%);font-size:14px;line-height:20px;font-weight:600;white-space:nowrap}
#app.loading #mapload{display:inline-flex;animation:mlIn .4s cubic-bezier(.3,1.4,.5,1) both}
#app.loading.onpage #mapload,#app.loading.searching #mapload{display:none}
@keyframes mlIn{from{opacity:0;transform:translate(-50%,-30%) scale(.9)}}
.ml-pin{width:32px;height:32px;display:grid;place-items:center}.ml-pin .px{width:28px;height:28px;animation:mlHop .9s cubic-bezier(.3,1.6,.5,1) infinite alternate}
@keyframes mlHop{from{transform:translateY(2px)}to{transform:translateY(-4px)}}
.ml-dots{display:inline-flex;gap:3px}.ml-dots i{width:5px;height:5px;border-radius:50%;background:#8B5CF6;animation:vdot 1s calc(var(--d,0)*1s) ease-in-out infinite}
.ml-dots i:nth-child(2){animation-delay:.15s}.ml-dots i:nth-child(3){animation-delay:.3s}
#app.loading #overlay .pin{display:none}
/* image fade-in with shimmer while loading */
.pc-img img:not(.px),.li-img img:not(.px),.akc-img img:not(.px),.sp-ph img,.pbub img,.rvc-p{opacity:0;transition:opacity .4s ease;animation:imgSafe 0s 3s forwards}
.pc-img img.imgok,.li-img img.imgok,.akc-img img.imgok,.sp-ph img.imgok,.pbub img.imgok,.rvc-p.imgok{opacity:1}
@keyframes imgSafe{to{opacity:1}}
.pc-img:has(>img:not(.px):not(.imgok)),.li-img:has(>img:not(.px):not(.imgok)),.akc-img:has(>img:not(.px):not(.imgok)),.sp-ph:has(>img:not(.imgok)),.rvc-p:not(.imgok){background:linear-gradient(100deg,#F1F1F3 20%,#FAFAFB 40%,#F1F1F3 60%);background-size:300% 100%;animation:skm 1.4s linear infinite}

/* ===== Onboarding polish ===== */
#app.scr::after{content:"";position:absolute;inset:0;z-index:49;background:#fff;pointer-events:none}
#onboard.noanim .av3-panel,#onboard.noanim .enter,#onboard.noanim .ob,#onboard.noanim .seg5,#onboard.noanim .avopt{animation:none!important}
/* softer landing ripple: pink + light pink ellipses instead of a blue box */
.ring{border-radius:50%;border-width:3px}
.ring.r2{border-color:#FFB3D1}
/* trophy: gentle tilt + bob instead of a full spin that goes edge-on and vanishes */
@keyframes trophyTilt{0%,100%{transform:rotateY(-22deg) translateY(0)}50%{transform:rotateY(22deg) translateY(-10px)}}
.anim-flip .w-spr{animation:trophyTilt 3s ease-in-out infinite}
.w-obj.kick.anim-flip .w-spr{animation:spinY .7s cubic-bezier(.6,0,.4,1)}
/* toasts during onboarding sit above the bottom button, not over the content */
#app.scr .toast{top:auto;bottom:calc(var(--h-xl,56px) + 48px + env(safe-area-inset-bottom,0px))}


/* ===== Onboarding v3: header, fit-to-screen, spice, rain ===== */
.ob-head{position:sticky;top:0;z-index:6;background:#fff}
.ob-head .f-top.ob-top{position:static;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:0;height:calc(64px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);border-bottom:0}
.ob-head .backbtn{justify-self:start}
.ob-head .skip{justify-self:end}
.ob-head .sp{width:48px;justify-self:end}
.ob-ttl{text-align:center;font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob-prog{padding:0 var(--gutter) var(--s4);border-bottom:1px solid var(--line)}
.opr{display:flex;align-items:center;justify-content:space-between;height:24px;margin-bottom:var(--s2)}
.opr b{font-size:13px;line-height:16px;font-weight:600;color:var(--mute)}
.opr em{height:24px;padding:0 var(--s3);display:inline-flex;align-items:center;border-radius:var(--r-full);background:var(--t-blue);color:#1E4FD6;font-style:normal;font-size:12px;line-height:16px;font-weight:600}
.ob-prog .dots{display:flex;gap:6px}
.ob-prog .dots i{flex:1;height:8px;border-radius:var(--r-full);background:var(--surface-2);position:relative;overflow:hidden}
.ob-prog .dots i.past{background:var(--p1)}
.ob-prog .dots i.on{background:var(--surface-2)}
.ob-prog .dots i.on::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--p1);transform-origin:left;transform:scaleX(.5);animation:segGrow .6s .15s cubic-bezier(.3,1.2,.5,1) both}
@keyframes segGrow{from{transform:scaleX(0)}}
/* steps that must fit the screen (no scrolling) */
#onboard.fit.show{display:flex;flex-direction:column}
#onboard.fit>.ob-head{flex:none}
#onboard.fit>.ob{flex:1;min-height:0}
#onboard.fit .ob.tinder{display:flex;flex-direction:column;overflow:hidden;padding-top:var(--s4);padding-bottom:0}
#onboard.fit .tt-head{flex:none;margin-bottom:var(--s3)}
#onboard.fit .tinder .deck{flex:1 1 auto;min-height:200px;max-height:520px;height:auto;margin-bottom:var(--s4)}
#onboard.fit .tinder .swbtns{flex:none}
#onboard.fit .tinder .tray{flex:none;position:static;margin-top:var(--s4)}
#onboard.fit .tinfo h3{font-size:22px;line-height:28px}
/* spice step */

/* ===== Intro animation (v2: build → 3D spin → double bloom → name → zoom out) ===== */
#intro{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s10,40px);background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden}

.in-heart{position:absolute;inset:0;transform-style:preserve-3d}
.in-l{position:absolute;inset:0;transform:translateZ(var(--z));transform-style:preserve-3d}
.in-l i{position:absolute;left:calc(var(--x) * 12px);top:calc(var(--y) * 12px);width:12px;height:12px}
.in-l.hzf i{background:#FF2E4D;box-shadow:inset -1.5px -1.5px 0 rgba(120,0,20,.3),inset 1.5px 1.5px 0 rgba(255,255,255,.2);opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--r)) scale(.3)}
.in-l.hzf i.inhl{background:#FF6A80}
.in-l.hzm i{background:#C8102E}
.in-l.hzb i{background:#8E0A20}
.in-l.hzm,.in-l.hzb{opacity:0;transition:opacity .25s}
#intro.play .in-l.hzf i{animation:pxIn .7s var(--d) cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pxIn{0%{opacity:0}25%{opacity:1}75%{transform:scale(1.15)}100%{opacity:1;transform:none}}
#intro.built .in-l.hzf i{opacity:1;transform:none}
#intro.built .in-l.hzm,#intro.built .in-l.hzb{opacity:1}
/* 3D spin with a little lift */
#intro.sp3 .in-spin{animation:spin3d 1.25s cubic-bezier(.65,0,.35,1) both}
@keyframes spin3d{0%{transform:rotateY(0) rotateX(0) translateY(0) scale(1)}35%{transform:rotateY(150deg) rotateX(14deg) translateY(-18px) scale(.92)}70%{transform:rotateY(330deg) rotateX(-6deg) translateY(-6px) scale(1.02)}100%{transform:rotateY(360deg) rotateX(0) translateY(0) scale(1)}}
/* double heartbeat "bloom bloom" */
#intro.bl1 .in-heart{animation:inPop1 .42s cubic-bezier(.3,1.7,.5,1)}
#intro.bl2 .in-heart{animation:inPop2 .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes inPop1{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes inPop2{0%{transform:scale(1)}35%{transform:scale(1.42)}65%{transform:scale(.94)}100%{transform:scale(1)}}
.in-bloom{position:absolute;left:50%;top:46%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px solid #FF3E9A;opacity:0;transform:scale(.4);pointer-events:none}

#intro.bl2 .in-bloom.b2{animation:inBloom 1.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes inBloom{0%{opacity:0;transform:scale(.5)}15%{opacity:.9}100%{opacity:0;transform:scale(2.2)}}
@keyframes flashBg{0%{background-color:#fff}30%{background-color:#FFE4F1}100%{background-color:#fff}}
.in-burst{position:absolute;left:50%;top:44%;pointer-events:none}
.in-burst i{position:absolute;width:var(--s);height:var(--s);background:var(--c);opacity:0}
#intro.bl1 #inBurst i{animation:inBurst .8s cubic-bezier(.2,.8,.3,1) forwards}
#intro.bl2 #inBurst2 i{animation:inBurst 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes inBurst{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--bx),var(--by)) rotate(180deg) scale(.4)}}
/* name drops in letter by letter, pixel-steppy */
.in-word{display:flex;flex-direction:column;align-items:center;gap:var(--s2)}

/* exit: zoom through the heart into Get started */

const $=s=>document.querySelector(s);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function status(m){const s=$('#status');s.textContent=m||'';s.style.display=m?'block':'none'}
function nearestArea(lat,lng){let b=null,d=1e9;for(const a of AREAS){const dd=(a[1]-lat)**2+(a[2]-lng)**2;if(dd<d){d=dd;b=a[0]}}return b}
let profiles={}; /* profiles/<uid> = {nick, avatar, spice, taste, home, onboarded} */
function nameOf(id){if(!id||id==='seed')return 'Ruchi Team';if(id==='osm')return 'OpenStreetMap';if(profiles[id]?.nick)return profiles[id].nick;if(id===myId)return names[id]||'You';return names[id]||'A local'}
function initials(n){return (n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function avOf(id){if(!id||id==='seed')return `<span class="lgh-av">${ASKIC}</span>`;const p=profiles[id];if(p?.av)return avImg(p.av);return p?.avatar?px(p.avatar):initials(nameOf(id))}

/* confirmations: confirms/<uid> = {spots:{id:true}, closed:{id:true}} */
function confirmsFor(id){let n=0;for(const k in confirmDocs){if(confirmDocs[k]?.spots?.[id])n++}return n}
function closedFor(id){let n=0;for(const k in confirmDocs){if(confirmDocs[k]?.closed?.[id])n++}return n}
function totalConfirms(s){return (s.seedConfirms||0)+confirmsFor(s.id)}
function isVerified(s){return totalConfirms(s)>=2}
function iConfirmed(id){return !!confirmDocs[myId]?.spots?.[id]}

/* points: 10 per spot, 3 per confirmation your spots receive, 1 per confirmation you give */
function scoreboard(){
  const m={};
  const add=(u,k,v)=>{if(!u||u==='seed'||u==='osm')return;m[u]=m[u]||{id:u,spots:0,recv:0,given:0};m[u][k]+=v};
  for(const s of spots){add(s.by,'spots',1);add(s.by,'recv',confirmsFor(s.id))}
  for(const u in confirmDocs){add(u,'given',Object.keys(confirmDocs[u]?.spots||{}).length)}
  for(const u in reviewDocs){add(u,'given',2*Object.keys(reviewDocs[u]?.items||{}).length)}
  if(myId&&!m[myId])m[myId]={id:myId,spots:0,recv:0,given:0};
  return Object.values(m).map(r=>({...r,pts:r.spots*10+r.recv*3+r.given})).sort((a,b)=>b.pts-a.pts);
}

function bindSheetDrag(sh){if(sh._drag)return;sh._drag=true;let y0=0,dy=0,on=false,t0=0;

  sh.addEventListener('touchstart',e=>start(e.touches[0].clientY,!!e.target.closest('.grab')),{passive:true});
  sh.addEventListener('touchmove',e=>{e._grab=!!e.target.closest('.grab');move(e.touches[0].clientY,e)},{passive:false});
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);

  sh.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;e._grab=true;move(e.clientY,e)});
  sh.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')end()});}

function wrap(ctx,text,x,y,maxW,lh,maxLines){const words=String(text).split(' ');let line='',lines=0;
  for(let i=0;i<words.length;i++){const test=line?line+' '+words[i]:words[i];if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;lines++;line=words[i];if(lines>=maxLines-1){const rest=words.slice(i).join(' ');let t=rest;while(ctx.measureText(t+'…').width>maxW&&t.length)t=t.slice(0,-1);ctx.fillText(t+(t!==rest?'…':''),x,y);return y+lh}}else line=test}
  ctx.fillText(line,x,y);return y+lh}

  x.save();x.beginPath();x.roundRect(64,64,952,640,56);x.clip();

    if(im){const k=Math.max(952/im.width,640/im.height);x.drawImage(im,64+(952-im.width*k)/2,64+(640-im.height*k)/2,im.width*k,im.height*k)}}
  else{const ic=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=ICONS[t.key]});if(ic){x.imageSmoothingEnabled=false;x.drawImage(ic,340,184,400,400);x.imageSmoothingEnabled=true}}
  x.restore();

  x.fillStyle='#71717A';x.font='500 32px "Poppins"';x.fillText(t.label+' · '+s.area,72,784);
  x.fillStyle='#09090B';x.font='500 88px "Nohemi"';let y=wrap(x,s.name,68,888,940,100,2);
  x.fillStyle='#71717A';x.font='500 32px "Poppins"';x.fillText(s.tag==='tourist'?'Don’t miss':'Order this',72,y+28);
  x.fillStyle='#09090B';x.font='600 44px "Poppins"';wrap(x,s.dish,72,y+84,920,52,1);
  x.fillStyle='#09090B';x.beginPath();x.roundRect(64,1190,952,96,28);x.fill();
  x.fillStyle='#fff';x.font='500 44px "Nohemi"';x.fillText('Ruchi',104,1252);
  x.font='500 28px "Poppins"';x.textAlign='right';x.fillText('Discovered by '+nameOf(s.by),976,1248);
  return c;
}

/* ================= INTRO: pixel heart assembles, beats, hands off ================= */
const HEART=['..XXX...XXX..','.XXXXX.XXXXX.','XXXXXXXXXXXXX','XXXXXXXXXXXXX','XXXXXXXXXXXXX','.XXXXXXXXXXX.','..XXXXXXXXX..','...XXXXXXX...','....XXXXX....','.....XXX.....','......X......'];
let introT=[];
function introRun(){const el=$('#intro');if(!el)return;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  // 3 stacked layers = a chunky voxel heart that shows depth when it spins
  const layer=(z,cls,fly)=>{let h=`<div class="in-l ${cls}" style="--z:${z}px">`;HEART.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=='X')return;
    const hi=fly&&((y<=2&&x>=1&&x<=4)||(y===3&&x===1));const a=Math.random()*Math.PI*2,d=260+Math.random()*320;
    h+=`<i class="${hi?'inhl':''}" style="--x:${x};--y:${y};--fx:${Math.round(Math.cos(a)*d)}px;--fy:${Math.round(Math.sin(a)*d)}px;--r:${Math.round(Math.random()*540-270)}deg;--d:${Math.round((10-y)*70+Math.abs(x-6)*35+Math.random()*160)}ms"></i>`}));return h+'</div>'};
  $('#inHeart').innerHTML=layer(-18,'hzb',0)+layer(-12,'hzm',0)+layer(-6,'hzm',0)+layer(0,'hzf',1);
  const sp=(id,n,r)=>{$(id).innerHTML=Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2+Math.random()*.3,d=r*(.7+Math.random()*.6);return `<i style="--bx:${Math.round(Math.cos(a)*d)}px;--by:${Math.round(Math.sin(a)*d)}px;--c:${['#FF3E9A','#FF7A1A','#8B5CF6','#2F6BFF','#3DBE29','#FF2E4D'][i%6]};--s:${6+Math.round(Math.random()*6)}px"></i>`}).join('')};
  sp('#inBurst',14,120);sp('#inBurst2',20,165);
  $('#inWord').innerHTML=[...'Ruchi'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
  el.classList.add('play');if(reduce){el.classList.add('calm');introT=[setTimeout(introEnd,1100)];return}
  const at=(ms,fn)=>introT.push(setTimeout(fn,ms));const hap=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
  at(1750,()=>el.classList.add('built'));
  at(1900,()=>el.classList.add('sp3'));
  at(3150,()=>{el.classList.add('bl1');hap(18)});
  at(3550,()=>{el.classList.add('bl2');hap(28)});
  at(3800,()=>el.classList.add('word'));
  at(5000,introEnd);}
function introEnd(){const el=$('#intro');if(!el||el.classList.contains('out'))return;introT.forEach(clearTimeout);if($('#landing').classList.contains('show')){slide=0;renderLanding()}el.classList.add('built','word','out');setTimeout(()=>el.remove(),700)}

/* ================= REAL MAP TILES (whole city + district) =================
   Street tiles: Esri light-grey canvas (or CARTO with a key), OpenStreetMap data. They sit on top of the
   hand-drawn map; if tiles can't load, the drawn map shows instead. */
/* CARTO needs a key since Sept 2026 (keyless tiles come back watermarked). With
   RUCHI_CONFIG.cartoKey set we use CARTO; otherwise Esri's keyless light-grey canvas. */
/* ================= THEME (system / light / dark) ================= */
function isDark(){return document.documentElement.classList.contains('dark')}
function themePref(){try{return localStorage.getItem('ruchi_theme')||'system'}catch(e){return 'system'}}
const DARKQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){const p=themePref(),d=p==='dark'||(p==='system'&&!!DARKQ&&DARKQ.matches),was=isDark();
  document.documentElement.classList.toggle('dark',d);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content',d?'#0B0B0C':'#FFFFFF'));
  try{const SB=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SystemBars;SB&&SB.setStyle&&SB.setStyle({style:d?'DARK':'LIGHT'}).catch(()=>{})}catch(e){}
  if(was!==d&&typeof LG!=='undefined'&&LG.on){LG.els.forEach(st=>st.dark=null);setTimeout(lgScan,30)}
  if(was!==d){try{const g=$('#tiles');if(g)g.innerHTML='';tileEls.clear();tileZ=null;tileOK=true;tileErr=0;tileGood=0;queueTiles()}catch(e){}}}
function setTheme(p){if(p===themePref()&&!(p==='system'))return;try{localStorage.setItem('ruchi_theme',p)}catch(e){}try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}
  const flip=()=>{applyTheme();if($('#setp')?.classList.contains('show'))renderSettings()};
  // one cheap snapshot cross-fade instead of animating every element
  if(document.startViewTransition&&!reduceMotion())document.startViewTransition(flip);else flip()}
if(DARKQ){const f=()=>{if(themePref()==='system')applyTheme()};DARKQ.addEventListener?DARKQ.addEventListener('change',f):DARKQ.addListener(f)}
const CARTO_KEY=((window.RUCHI_CONFIG||{}).cartoKey||'').trim();
const TILE_MAX=CARTO_KEY?18:16;
const TILE_URL=CARTO_KEY
  ?(z,x,y)=>`https://basemaps.cartocdn.com/rastertiles/${isDark()?'dark_all':'light_all'}/${z}/${x}/${y}@2x.png?key=${encodeURIComponent(CARTO_KEY)}`
  :(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${isDark()?'Dark':'Light'}_Gray_Base/MapServer/tile/${z}/${y}/${x}`;
const TILE_ATTR=CARTO_KEY
  ?'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'
  :'Powered by <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, HERE, Garmin';
{const a=document.getElementById('mapattr');if(a)a.innerHTML=TILE_ATTR}
let tileOK=true,tileErr=0,tileGood=0,tileQ=0,tileZ=null,tileGC=0;const tileEls=new Map();
const lng2tx=(l,z)=>(l+180)/360*2**z, lat2ty=(a,z)=>{const r=a*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z};
const tx2lng=(x,z)=>x/2**z*360-180, ty2lat=(y,z)=>{const n=Math.PI-2*Math.PI*y/2**z;return 180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)))};
function queueTiles(){if(!tileOK)return;if(!tileQ)tileQ=requestAnimationFrame(()=>{tileQ=0;updateTiles()})}
function updateTiles(){const g=$('#tiles');if(!g||!tileOK)return;const r=mapEl.getBoundingClientRect();if(!r.width)return;
  const s=view.s,K=BOUNDS.k;let z=Math.round(Math.log2(K*s*360/256)+.3);z=Math.max(10,Math.min(TILE_MAX,z));
  const lngA=BOUNDS.lngMin+(-view.x/s)/K,lngB=BOUNDS.lngMin+((r.width-view.x)/s)/K,latA=BOUNDS.latMax-(-view.y/s)/K,latB=BOUNDS.latMax-((r.height-view.y)/s)/K;
  const x0=Math.floor(lng2tx(lngA,z)),x1=Math.floor(lng2tx(lngB,z)),y0=Math.floor(lat2ty(latA,z)),y1=Math.floor(lat2ty(latB,z));
  if((x1-x0+1)*(y1-y0+1)>90)return;
  const need=new Set();
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const k=z+'/'+x+'/'+y;need.add(k);if(tileEls.has(k))continue;
    const a=toXY(ty2lat(y,z),tx2lng(x,z)),b=toXY(ty2lat(y+1,z),tx2lng(x+1,z));
    const im=document.createElementNS('http://www.w3.org/2000/svg','image');
    im.setAttribute('x',a.x);im.setAttribute('y',a.y);im.setAttribute('width',b.x-a.x+.6/s);im.setAttribute('height',b.y-a.y+.6/s);im.setAttribute('preserveAspectRatio','none');im.setAttribute('class','mtile');
    im.addEventListener('load',()=>{tileGood++;im.classList.add('in');$('#app').classList.add('tiles')});
    im.addEventListener('error',()=>{tileErr++;im.remove();tileEls.delete(k);if(!tileGood&&tileErr>=4){tileOK=false;g.innerHTML='';tileEls.clear();$('#app').classList.remove('tiles')}});
    im.setAttribute('href',TILE_URL(z,x,y));g.appendChild(im);tileEls.set(k,{el:im,z})}
  for(const [k,t] of tileEls)if(!need.has(k)&&t.z===z){t.el.remove();tileEls.delete(k)}
  if(z!==tileZ){tileZ=z;clearTimeout(tileGC);tileGC=setTimeout(()=>{for(const [k,t] of tileEls)if(t.z!==tileZ){t.el.remove();tileEls.delete(k)}},900)}
  // keep the current zoom level on top
  for(const k of need){const t=tileEls.get(k);if(t)g.appendChild(t.el)}
}

  try{const ps=await userx.profiles(need);for(const i of need)names[i]=ps?.[i]?.name||'';return true}catch(e){return false}
}

const BITS=['#FFD23F','#FFB000','#FFF3B0','#FF8A00','#7BC74D','#FFD23F'];
function objFx(a){

function otpIn(el,k){el.value=el.value.replace(/\D/g,'');const all=[...document.querySelectorAll('#otp input')];if(el.value&&k<3)all[k+1].focus();

function startOnboarding(single){

      likes:[],hist:[],seen:0,spice:p.spice??2,home:p.home||'',taste:p.taste?.id||null,pact:[],signed:false,pactAt:p.pactAt||null,
      done:{name:!!p.nick,avatar:!!p.avSet,pact:!!p.pactAt,taste:!!p.tasteDone,spice:p.spice!=null,turf:!!p.home},single:null};
  if(single){ob.single=single;ob.step=STEPS.findIndex(s=>s.k===single)}

}
function obTop(skipFn,skipLabel){

  return `<div class="ob-head"><div class="f-top ob-top"><button class="backbtn" aria-label="Back" onclick="${back}">${BACKSVG}</button>
    <div class="ob-ttl">${single?'Finish setup':esc(st.t)}</div>
    ${skipFn?`<button class="skip" onclick="${skipFn}">${skipLabel||'Skip'}</button>`:'<div class="sp"></div>'}</div>
    ${single?'':`<div class="ob-prog"><div class="opr"><b>Step ${ob.step+1} of ${STEPS.length}</b>${badge}</div>
      <div class="dots" role="progressbar" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${ob.step+1}">${STEPS.map((s,i)=>`<i class="${i<ob.step?'past':i===ob.step?'on':''}"></i>`).join('')}</div></div>`}</div>`;

function buildNotifs(){
  const out=[];const p=profiles[myId]||{};const mine=spots.filter(s=>s.by===myId);
  for(const s of mine){
    for(const u in confirmDocs){if(u!==myId&&confirmDocs[u]?.spots?.[s.id])out.push({id:`c_${u}_${s.id}`,ic:'smile',tint:'t-gr',t:`<b>${esc(nameOf(u))}</b> checked in at <b>${esc(s.name)}</b>. +3 pts for you`,at:(s.createdAt||Date.now())+36e5,go:()=>openSpot(s.id)})}
    for(const r of reviewsFor(s.id)){if(r.by!==myId)out.push({id:`r_${r.by}_${s.id}`,ic:'emoji-1f4f8',tint:'t-bl',t:`<b>${esc(nameOf(r.by))}</b> reviewed <b>${esc(s.name)}</b> ${'★'.repeat(+r.rating||0)}`,at:r.at||Date.now(),go:()=>openSpot(s.id)})}
  }
  const wk=Date.now()-14*864e5;
  spots.filter(s=>s.by&&s.by!==myId&&s.by!=='seed'&&s.by!=='osm'&&(s.createdAt||0)>wk).slice(0,4).forEach(s=>out.push({id:`n_${s.id}`,ic:s.hidden?'emoji-1f48e':(TAG[s.tag]?.key||'map-pin'),tint:'t-pk',t:`New ${s.hidden?'hidden gem':(TAG[s.tag]?.label||'spot').toLowerCase()} pinned in <b>${esc(s.area)}</b>: ${esc(s.name)}`,at:s.createdAt,go:()=>openSpot(s.id)}));
  const me=scoreboard().find(r=>r.id===myId);const lv=level(me?.pts||0);
  if(LEVELS.indexOf(lv.cur)>0)out.push({id:`lv_${lv.cur.t}`,ic:'emoji-1f947',tint:'t-or',t:`Level up! You’re now a <b>${lv.cur.t}</b>`,at:Date.now()-6e5,go:()=>go('me')});
  const rk=scoreboard().filter(r=>r.pts>0).findIndex(r=>r.id===myId);
  if(rk>=0&&rk<3)out.push({id:`rk_${rk}`,ic:'trophy',tint:'t-or',t:`You’re <b>#${rk+1}</b> on the Insiders board. ${rk===0?'Crown secured.':'Podium energy.'}`,at:Date.now()-12e5,go:()=>go('board')});

  return out.sort((a,b)=>b.at-a.at);
}

   One pop-up per app open:
   - first time ever      -> Welcome (confetti, waving avatar, tips)
   - away 7+ days         -> Welcome back (days away, what's new since)
   - every other open     -> rotating daily pop: Insiders rank / new near you / pick for right now
   All share one card: spring entrance, swipe down to dismiss, count-ups, shimmer CTA. */

function lastSeenGet(){return +prefGet('last_seen','0')||0}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&LANDED)lastSeenTouch()});
addEventListener('pagehide',()=>{if(LANDED)lastSeenTouch()});
function landingPop(force){if(LANDED&&!force)return;LANDED=true;const last=lastSeenGet();

/* ================= LIQUID GLASS =================
   iOS-style glass: the rim bends what's behind it (real refraction on Android /
   Chrome engines via an SVG displacement map made for each element's exact size
   and corner radius), plus specular rim light and a soft press squish.
   iPhone WebKit can't refract a backdrop, so there it falls back to the frosted
   glass + rim light (looks right, just without the bending). */
const LG={on:false,els:new Map(),n:0,ro:null};
const LG_SEL='.hcard.glass,#lgbar,#mapctl .listbtn,#mapctl .cardtog';
let lgMT=0;function lgMoving(){const h=document.documentElement;if(!h.classList.contains('lg-moving'))h.classList.add('lg-moving');clearTimeout(lgMT);lgMT=setTimeout(()=>h.classList.remove('lg-moving'),160)}
function lgSupported(){const ua=navigator.userAgent;const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
  return !ios&&/Chrome\/|Chromium|EdgA?\//.test(ua)&&CSS.supports&&CSS.supports('backdrop-filter','url(#x)')}
function lgMap(w,h,r,bezel){ // displacement map: only the rim (bezel) bends, centre stays clear
  const k=2,W=Math.max(2,Math.round(w/k)),H=Math.max(2,Math.round(h/k));const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');const im=x.createImageData(W,H),d=im.data;const a=w/2,b=h/2;r=Math.min(r,a,b);
  for(let j=0;j<H;j++){const py=(j+.5)*k-b;for(let i=0;i<W;i++){const px_=(i+.5)*k-a;
    const qx=Math.abs(px_)-a+r,qy=Math.abs(py)-b+r;let dist,nx,ny;
    if(qx>0&&qy>0){const L=Math.hypot(qx,qy)||1;dist=r-L;nx=qx/L*Math.sign(px_);ny=qy/L*Math.sign(py)}
    else if(qx>qy){dist=r-qx;nx=Math.sign(px_);ny=0}else{dist=r-qy;nx=0;ny=Math.sign(py)}
    let m=0;if(dist<bezel){const t=Math.max(0,dist)/bezel;m=Math.pow(1-t,2.2)}
    const o=(j*W+i)*4;d[o]=128+nx*m*127;d[o+1]=128+ny*m*127;d[o+2]=128;d[o+3]=255}}
  x.putImageData(im,0,0);return c.toDataURL()}
function lgBuild(el){const rc=el.getBoundingClientRect();const w=Math.round(rc.width),h=Math.round(rc.height);if(w<8||h<8)return;
  let st=LG.els.get(el);if(st&&st.w===w&&st.h===h&&st.dark===isDark())return;
  const cs=getComputedStyle(el);const r=Math.min(parseFloat(cs.borderTopLeftRadius)||h/2,h/2,w/2);
  const id=st?st.id:'lgf'+(++LG.n);const bezel=Math.min(22,h*.32),scale=Math.min(56,h*.62);
  const defs=$('#lgdefs');let f=document.getElementById(id);
  if(!f){f=document.createElementNS('http://www.w3.org/2000/svg','filter');f.id=id;defs.appendChild(f)}
  ['x','y'].forEach(a=>f.setAttribute(a,0));f.setAttribute('width',w);f.setAttribute('height',h);
  f.setAttribute('filterUnits','userSpaceOnUse');f.setAttribute('primitiveUnits','userSpaceOnUse');f.setAttribute('color-interpolation-filters','sRGB');
  f.innerHTML=`<feGaussianBlur in="SourceGraphic" stdDeviation="${isDark()?5:4}" result="b"/>
    <feImage href="${lgMap(w,h,r,bezel)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/>
    <feDisplacementMap in="b" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feColorMatrix in="d" type="saturate" values="${isDark()?1.4:1.8}"/>`;

  let t=0;LG.ro=new ResizeObserver(es=>{clearTimeout(t);t=setTimeout(()=>es.forEach(e=>lgBuild(e.target)),80)});

async function shareRuchi(){const d={title:'Ruchi',text:'I’m finding hidden food spots in Trivandrum on Ruchi 🌶️ Thattukadas, chaya kadas and toddy shops locals gatekeep.'};
  try{if(navigator.share){await navigator.share(d);return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(d.text);toast('Copied, paste it anywhere')}catch(e){toast('Sharing isn’t available here')}}
function askDelete(){closeSettings();
  $('#addSheet').innerHTML=`<div class="grab"></div><div class="form gate"><div class="gate-ic del-ic">${sic('trash')}</div><h2>Delete your account?</h2>
  <div class="sub">This permanently removes your profile, reviews, check-ins, saved plans and the spots you pinned. It can’t be undone.</div>
  <div class="actions"><button class="btn" onclick="closeSheets()">Keep account</button><button class="btn del-go" id="delGo" onclick="deleteAccount()">Delete forever</button></div></div>`;
  showSheet('addSheet')}
async function deleteAccount(){const b=$('#delGo');if(b){b.disabled=true;b.textContent='Deleting…'}
  const id=myId;
  try{if(dbx&&id&&id!=='preview'){
    const mine=spots.filter(s=>s.by===id&&!/^osm/.test(String(s.id)));
    await Promise.all([...mine.map(s=>dbx.doc('spots/'+s.id).delete().catch(()=>{})),
      ...['profiles','reviews','confirms','experiments'].map(c=>dbx.doc(c+'/'+id).delete().catch(()=>{}))]);}}catch(e){}
  try{const keep=['ruchi_theme','ruchi_uid'];Object.keys(localStorage).filter(k=>k.startsWith('ruchi_')&&!keep.includes(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}
  try{window.RUCHI_CLOUD&&RUCHI_CLOUD.sb&&RUCHI_CLOUD.sb.auth.signOut()}catch(e){}
  delete profiles[id];spots=spots.filter(s=>s.by!==id);if(reviewDocs[id])delete reviewDocs[id];ASK.thread=[];
  closeSheets();sessionSet(false);go('map',true);renderLanding();show('landing','back');setTimeout(()=>toast('Your account was deleted'),400)}
function logout(){sessionSet(false);closeSheets();go('map',true);renderLanding();show('landing','back')}
function replayOnboarding(){closeSheets();startOnboarding()}

/* ================= BOOT ================= */
document.querySelectorAll('[data-px]').forEach(e=>e.innerHTML=px(e.dataset.px));{const a=$('#askBtn');if(a)a.innerHTML=`<span class="hflip"><span class="hf-f">${ASKIC}</span><span class="hf-b">${ASKIC}</span></span>`}
$('#app').classList.add('loading');drawMap();renderChips();bindCards();
requestAnimationFrame(()=>{centerOn(8.505,76.945,.55)});
window.addEventListener('resize',()=>renderOverlay());
spots=withOsm(FALLBACK.slice());reviewDocs=structuredClone(FALLBACK_REVIEWS);renderLanding();rerenderAll();
applyTheme();show('landing');introRun();

(async function boot(){
  let user=null,db=null;
  try{[user,db,dl]=await Promise.all([claude.use('user'),claude.use('db'),claude.use('downloads')])}catch(e){}
  userx=user;
  if(user){try{myId=await user.id()}catch(e){}}
  if(myId)loadNames([myId]);
  if(!db||!myId){
    myId=myId||'preview';const lp=localProfile();if(lp)profiles[myId]=lp;
    if(sessionGet()&&lp?.onboarded)enterApp();
    loadDone();status('Preview mode — sample spots only');setTimeout(()=>status(''),4000);return}
  dbx=db;const timer=setTimeout(()=>{status('Can’t reach the map data yet…');loadDone()},10000);
  let firstProfiles=true;
  db.collection('profiles').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>m[d.id]=d.data());
    if(!m[myId]&&profiles[myId])m[myId]=profiles[myId];
    profiles=m;setLoaded('profiles');rerenderAll();
    if(firstProfiles&&!snap.metadata.fromCache){firstProfiles=false;
      if(sessionGet()&&profiles[myId]?.onboarded&&$('#landing').classList.contains('show'))enterApp()}
  },()=>setLoaded('profiles'));
  db.collection('spots').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);status('')}
    live=true;spots=withOsm(snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>typeof s.lat==='number'&&typeof s.lng==='number'));
    loadNames(spots.map(s=>s.by)).then(c=>c&&rerenderAll());
    setLoaded('spots');rerenderAll();renderLanding();
    if(selected&&$('#spotSheet').classList.contains('show'))openSpot(selected);
  },e=>{clearTimeout(timer);loadDone();status('Couldn’t load spots');setTimeout(()=>status(''),4000)});
  db.collection('reviews').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>m[d.id]=d.data());if(myId&&!m[myId]&&reviewDocs[myId]&&reviewDocs!==FALLBACK_REVIEWS)m[myId]=reviewDocs[myId];reviewDocs=m;
    loadNames(Object.keys(m)).then(c=>c&&rerenderAll());setLoaded('reviews');rerenderAll();
    if(selected&&$('#spotSheet').classList.contains('show'))openSpot(selected);
  },()=>setLoaded('reviews'));
  db.collection('confirms').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>m[d.id]=d.data());confirmDocs=m;setLoaded('confirms');
    loadNames(Object.keys(m)).then(c=>c&&rerenderAll());
    rerenderAll();
  },()=>setLoaded('confirms'));
})();
</script>
