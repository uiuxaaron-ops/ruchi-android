/* =========================================================
   RUCHI DESIGN SYSTEM v2 — quiet minimal + pixel identity
   4px grid. Black is the only action colour. Vibrant colour lives
   in the pixel icons, tinted tiles and the hidden-gem accent.
   ========================================================= */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  --gutter:20px;
  --h-sm:32px; --h-md:40px; --h-lg:48px; --h-xl:56px;
  --r-sm:12px; --r-md:16px; --r-lg:24px; --r-full:999px;
  --white:#FFFFFF; --bg:#FFFFFF; --surface:#F4F4F5; --surface-2:#EBEBED; --line:#E4E4E7;
  --ink:#09090B; --ink-2:#3F3F46; --mute:#71717A;
  --p1:#09090B; --p1-dk:#000000; --t-p1:#F4F4F5; /* primary: black — actions, selection */
  --on-p1:#FFFFFF; --card:#FFFFFF;
  --map-sea:#E3EEF5; --map-land:#F4F4F5; --map-park:#E3F2DC; --map-road:#FFFFFF; --map-road-edge:#E4E6EA; --map-water:#D3E4EE; --map-dot:#E2D8BE;
  --p2:#FF2E4D; --t-p2:#FFE5E9;                  /* secondary: heart red — brand, highlights */
  --pink:var(--p2); --green:#3DBE29; --blue:#2F6BFF; --purple:#8B5CF6; --orange:#FF7A1A; --danger:#E5252A; --star:#FFB020;
  --t-pink:var(--t-p2); --t-green:#E3F7DD; --t-blue:#E4ECFF; --t-purple:#EFE8FF; --t-orange:#FFEBDD;
  --font-ui:'Poppins',system-ui,sans-serif;
  --font-serif:'Nohemi','Poppins',system-ui,sans-serif;
  --float:0 8px 24px rgba(9,9,11,.08),0 2px 4px rgba(9,9,11,.04);
}

/* type scale */
small,.t-xs{font-size:12px;line-height:16px}
.t-sm{font-size:14px;line-height:20px}
h3{font-family:var(--font-ui);font-size:18px;line-height:24px;font-weight:600;margin:0}
h2{font-family:var(--font-serif);font-size:28px;line-height:32px;font-weight:500;letter-spacing:-.02em;letter-spacing:0;margin:0}
h1{font-family:var(--font-serif);font-size:36px;line-height:40px;font-weight:500;letter-spacing:-.02em;letter-spacing:0;margin:0}
.display{font-family:var(--font-serif);font-weight:500;font-size:48px;line-height:48px;letter-spacing:0}

/* base */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E4E4E7;font-family:var(--font-ui);font-size:16px;line-height:24px;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--bg);overflow:hidden}
.muted{color:var(--mute)}.danger{color:var(--danger)!important}
.sp{width:var(--h-md);flex:none}

/* pixel sprites */
.px{width:20px;height:20px;image-rendering:pixelated;display:inline-block;vertical-align:-4px;object-fit:contain;flex:none}

/* tints (category tiles) */
.py{background:var(--t-orange)}.pp{background:var(--t-pink)}.pm{background:var(--t-green)}.ps{background:var(--t-blue)}.pv{background:var(--t-purple)}.pw{background:var(--surface)}

/* buttons */
.btn,.bigbtn,.cta{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);text-decoration:none;white-space:nowrap;transition:transform .1s,opacity .1s;font-weight:600}
.btn{height:var(--h-lg);padding:0 var(--s5);border-radius:var(--r-md);background:var(--surface);font-size:15px;line-height:20px}
.btn.pri,.bigbtn,.cta{background:var(--p1);color:#fff}
.bigbtn,.cta{width:100%;height:var(--h-xl);border-radius:var(--r-md);font-size:14px;line-height:20px;letter-spacing:.06em;text-transform:uppercase}
.bigbtn.ghost{background:var(--surface);color:var(--ink)}
.bigbtn:disabled{opacity:.25}
.btn.out{background:none;box-shadow:inset 0 0 0 1.5px var(--p1)}
.btn.yel{background:var(--p1);color:#fff}
.btn.done{background:var(--green);color:#fff}
.btn:active,.bigbtn:active,.cta:active,.circ:active,.backbtn:active,.chip:active{transform:scale(.97)}
.btn .px{width:24px;height:24px;vertical-align:0}
.circ,.backbtn{width:var(--h-md);height:var(--h-md);display:grid;place-items:center;border-radius:var(--r-full);background:var(--surface);font-size:18px;line-height:24px}
.chip{flex:none;height:var(--h-md);padding:0 var(--s4);display:inline-flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:var(--white);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;box-shadow:var(--float)}
.chip .px{width:20px;height:20px;vertical-align:0}
.chip.on{background:var(--p1);color:#fff}
.chip.gem.on{background:var(--pink);color:#fff}
.linkish{display:block;height:var(--h-md);margin:var(--s4) auto 0;color:var(--mute);font-size:14px;line-height:20px;text-decoration:underline;text-underline-offset:4px}
.textlink{height:var(--h-lg);margin-top:var(--s2);font-size:14px;line-height:20px;color:var(--mute)}
.textlink u{color:var(--ink);text-underline-offset:4px;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s6)}
.btn.full{grid-column:1/-1}

/* badges */
.badge,.tagp{display:inline-flex;align-items:center;gap:var(--s1);height:24px;padding:0 var(--s2);border-radius:var(--r-full);background:var(--surface);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2)}
.badge .px,.tagp .px{width:16px;height:16px;vertical-align:0}
.badge.gem,.tagp.gem{background:var(--pink);color:#fff}
.badge.ver{background:var(--t-green);color:#1B7A10}
.badge.demo{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--mute)}
.av{width:var(--h-md);height:var(--h-md);flex:none;display:grid;place-items:center;border-radius:var(--r-full);background:var(--t-orange);font-size:14px;line-height:20px;font-weight:600;overflow:hidden}
.av .px{width:28px;height:28px;vertical-align:0}
.av.lg{width:64px;height:64px;font-size:22px}.av.lg .px{width:40px;height:40px}

.logo{display:inline-flex;align-items:center;gap:var(--s2)}
.logo i{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--p1)}
.logo i .px{width:24px;height:24px;vertical-align:0}
.logo b{font-family:var(--font-serif);font-weight:500;font-size:24px;line-height:28px;letter-spacing:0}

/* =========================================================
   MAP
   top 16 · hello 48 · 12 · search 48 · 12 · chips 40 → 176; overlays start at 192
   ========================================================= */
#map{position:absolute;inset:0;touch-action:none;background:#E3EEF5;overflow:hidden;cursor:grab}
#map.dragging{cursor:grabbing}
#map svg{position:absolute;left:0;top:0;overflow:visible}
#overlay{position:absolute;inset:0;pointer-events:none;will-change:transform}
.area{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:11px;line-height:16px;font-weight:500;color:#A1A1AA;white-space:nowrap}
.pin{position:absolute;left:0;top:0;will-change:translate;transform:translate(-50%,-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.pin .bub{width:var(--h-lg);height:var(--h-lg);display:grid;place-items:center;border-radius:var(--r-full);background:#fff;box-shadow:var(--float)}
.pin .bub .px{width:40px;height:40px;vertical-align:0}
.pin.hidden .bub{box-shadow:0 0 0 3px var(--pink),var(--float)}
.pin.unver .bub{opacity:.9}
.pin .lbl{margin-top:var(--s1);height:24px;padding:0 var(--s2);display:flex;align-items:center;border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.pin.sel{z-index:5;transform:translate(-50%,-50%) scale(1.15)}
.pin.sel .bub{background:var(--p1);box-shadow:0 0 0 6px rgba(9,9,11,.12),var(--float)}
.pin.dim{opacity:.25;pointer-events:none}

#top{position:absolute;left:0;right:0;top:0;padding:var(--s4) var(--gutter) 0;z-index:10;pointer-events:none}
#top > *{pointer-events:auto}
.hello{display:flex;align-items:center;gap:var(--s3);height:var(--h-lg);margin-bottom:var(--s3);padding:var(--s1) var(--s1) var(--s1) var(--s1);padding-right:var(--s1);border-radius:var(--r-full);background:#fff;box-shadow:var(--float)}
.hello .me{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--r-full);background:var(--t-orange)}
.hello .me .px{width:28px;height:28px;vertical-align:0}
.hello .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.hello .txt b{font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello .txt small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello .txt small .px{width:16px;height:16px;vertical-align:-3px}
.me-chip{height:40px;padding:0 var(--s4);flex:none;display:flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:13px;line-height:16px;font-weight:500}
.me-chip .pts{color:#fff;font-weight:700}
.searchrow{display:flex;gap:var(--s2)}
.search{flex:1;height:var(--h-lg);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);border-radius:var(--r-full);background:#fff;box-shadow:var(--float)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;line-height:20px}
.search input::placeholder{color:var(--mute)}
.search svg{width:20px;height:20px;flex:none;color:var(--mute)}
#sresults{margin-top:var(--s2);max-height:304px;overflow-y:auto;display:none;border-radius:var(--r-lg);background:#fff;box-shadow:var(--float);padding:var(--s2)}
#sresults button{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--h-xl);padding:var(--s2);text-align:left;border-radius:var(--r-md)}
#sresults button:hover{background:var(--surface)}
#sresults button > span{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--surface)}
#sresults button .px{width:28px;height:28px;vertical-align:0}
#sresults b{font-size:14px;line-height:20px;font-weight:600}
#sresults small{display:block;color:var(--mute)}
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s3) var(--gutter) var(--s4);margin:0 calc(-1 * var(--gutter));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
#status,.toast{position:absolute;left:50%;top:192px;transform:translateX(-50%);z-index:70;display:none;max-width:calc(100% - 2 * var(--gutter));padding:var(--s2) var(--s4);border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:14px;line-height:20px;font-weight:500;text-align:center}
#status{z-index:9;white-space:nowrap}
.toast{display:block;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-8px);transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%)}
.zoom{position:absolute;right:var(--gutter);top:192px;z-index:9;display:flex;flex-direction:column;border-radius:var(--r-full);background:#fff;box-shadow:var(--float);overflow:hidden}
.zoom .circ{background:#fff;border-radius:0}
.zoom .circ+.circ{border-top:1px solid var(--line)}

/* spot carousel — 16 above the nav (nav 72 + bottom 16) */
#cards{position:absolute;left:0;right:0;bottom:96px;z-index:10;display:flex;gap:var(--s3);overflow-x:auto;padding:0 var(--gutter) var(--s4);scroll-snap-type:x mandatory;scroll-padding:0 var(--gutter);scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.scard{flex:0 0 calc(100% - 56px);height:128px;scroll-snap-align:start;display:flex;gap:var(--s3);padding:var(--s3);text-align:left;border-radius:var(--r-lg);background:#fff;box-shadow:var(--float)}
.scard .th{width:104px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:var(--r-md)}
.scard .th img:not(.px){width:100%;height:100%;object-fit:cover}
.scard .th .px{width:80px;height:80px;vertical-align:0}
.scard .bd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:var(--s1) 0}
.scard .bd b,.scard .bd small,.scard .row{align-self:stretch}
.scard b{margin-top:var(--s2);font-size:16px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .row{display:flex;gap:var(--s2);margin-top:auto}
.scard .go{height:var(--h-sm);padding:0 var(--s4);display:flex;align-items:center;border-radius:var(--r-full);box-shadow:inset 0 0 0 1.5px var(--p1);font-size:13px;line-height:16px;font-weight:600;text-decoration:none}
.scard .more{display:none}

/* nav — tabs pill + separate action button. 64 tall, 16 from bottom */
#nav{position:absolute;left:var(--s4);right:var(--s4);bottom:var(--s4);z-index:12;height:64px;display:flex;gap:var(--s3)}
#nav .tabs{flex:1;display:flex;gap:var(--s1);padding:var(--s2);border-radius:var(--r-full);background:#fff;box-shadow:var(--float)}
#nav .tabs button{flex:1;min-width:0;height:var(--h-lg);display:flex;align-items:center;justify-content:center;gap:var(--s2);border-radius:var(--r-full);color:#A1A1AA;transition:flex .25s cubic-bezier(.2,.9,.25,1),background .2s,color .2s}
#nav .tabs button svg{width:24px;height:24px;flex:none}
#nav .tabs button span{max-width:0;overflow:hidden;opacity:0;white-space:nowrap;font-size:14px;line-height:20px;font-weight:600;transition:max-width .25s,opacity .15s}
#nav .tabs button:hover{color:var(--ink-2)}
#nav .tabs button.on{flex:1.8;background:var(--p1);color:#fff}
#nav .tabs button.on span{max-width:96px;opacity:1}
#nav .add{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:var(--r-full);background:#fff;color:var(--ink);box-shadow:var(--float),inset 0 0 0 1.5px var(--line);transition:transform .1s}
#nav .add svg{width:24px;height:24px}
#nav .add:active{transform:scale(.94)}

/* =========================================================
   SHEETS
   ========================================================= */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(9,9,11,.32);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;background:#fff;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding-bottom:var(--s8)}
.sheet.show{transform:none}
.grab{width:40px;height:4px;margin:var(--s3) auto var(--s3);border-radius:var(--r-full);background:var(--surface-2)}

/* spot page */
.gal{display:flex;gap:var(--s3);overflow-x:auto;padding:0 var(--gutter);scroll-snap-type:x mandatory;scroll-padding:0 var(--gutter);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gph{flex:0 0 calc(100% - 64px);height:240px;scroll-snap-align:start;overflow:hidden;border-radius:var(--r-lg);background:var(--surface)}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.gph.gadd{flex:0 0 128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);font-size:13px;line-height:16px;font-weight:600}
.gph.gadd .px{width:40px;height:40px}
.hero{height:240px;margin:0 var(--gutter);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);border-radius:var(--r-lg)}
.hero > .px{width:160px;height:160px;vertical-align:0;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.nophoto{height:var(--h-sm);padding:0 var(--s4);display:flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:#fff;font-size:13px;line-height:16px;font-weight:600}
.nophoto .px{width:20px;height:20px;vertical-align:0}
.sbody{padding:var(--s5) var(--gutter) 0}
.brow{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s3)}
.sbody h2{font-size:32px;line-height:36px}
.meta{margin-top:var(--s2);color:var(--mute);font-size:14px;line-height:20px}
.meta .px{width:16px;height:16px;vertical-align:-3px}
.meta .rt{color:var(--ink);font-weight:600}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s6)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:var(--s2);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2)}
.qa .tile{width:56px;height:56px;display:grid;place-items:center;border-radius:var(--r-md);background:var(--surface);transition:transform .1s}
.qa button:active .tile{transform:scale(.94)}
.qa button.on .tile{background:var(--p1)}
.qa .px{width:40px;height:40px;vertical-align:0}
.info{margin-top:var(--s6);border-radius:var(--r-lg);background:var(--surface);padding:var(--s1) var(--s4)}
.irow{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:var(--s3) 0}
.irow+.irow{border-top:1px solid var(--line)}
.irow .ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--r-sm);background:#fff}
.irow .ic svg{width:20px;height:20px}
.irow small{display:block;color:var(--mute)}
.irow b{display:block;font-size:15px;line-height:20px;font-weight:600}
.note{margin-top:var(--s4);font-size:16px;line-height:24px;font-style:italic;color:var(--ink-2)}
.by{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);font-size:14px;line-height:20px}
.by small{display:block;color:var(--mute)}
.rvhead{display:flex;align-items:center;justify-content:space-between;height:var(--h-md);margin:var(--s8) 0 var(--s3)}
.rvsum{display:flex;align-items:center;gap:var(--s2)}
.rvsum b{font-size:18px;line-height:24px}
.rvsum small{color:var(--mute)}
.stars{display:inline-flex;gap:1px}
.stars i{font-style:normal;font-size:12px;line-height:16px;color:var(--surface-2)}
.stars i.on{color:var(--star)}
.rate{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3);padding:var(--s4);border-radius:var(--r-lg);background:var(--surface)}
.rate b{font-size:15px;line-height:20px;font-weight:600}
.rate small{display:block;color:var(--mute)}
.ratestars{display:flex;flex:none}
.ratestars button{width:28px;height:var(--h-md);font-size:24px;line-height:28px;color:#D4D4D8}
.ratestars button:hover{color:var(--star)}
.rv{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.rvt{display:flex;align-items:center;gap:var(--s3)}
.rvn b{display:block;font-size:14px;line-height:20px;font-weight:600}
.rvn small{color:var(--mute)}
.rvd{margin-top:var(--s3);color:var(--mute);font-size:13px;line-height:16px}
.rvd b{color:var(--ink);font-weight:600}
.rv p{margin:var(--s2) 0 0;font-size:15px;line-height:24px;color:var(--ink-2)}
.rvp{display:block;width:100%;height:200px;object-fit:cover;margin-top:var(--s3);border-radius:var(--r-md)}
.stickybar{position:sticky;bottom:calc(-1 * var(--s8));display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4);padding:var(--s3) var(--gutter) var(--s8);background:linear-gradient(rgba(255,255,255,0),#fff 16px)}
.stickybar .btn{height:var(--h-xl)}
.stickybar .btn.yel{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--p1)}
.lightbox{position:absolute;inset:0;z-index:80;display:grid;place-items:center;padding:var(--s6);background:rgba(9,9,11,.92)}
.lightbox img{max-width:100%;max-height:80%;border-radius:var(--r-md)}
.lightbox .circ{position:absolute;top:var(--s4);right:var(--s4);background:#fff}

/* forms */
.form{padding:0 var(--gutter)}
.form h2{margin-top:var(--s1)}
.form .sub{margin-top:var(--s2);color:var(--mute);font-size:14px;line-height:20px}
.form .sub .px{width:16px;height:16px;vertical-align:-3px}
.field{margin-top:var(--s5)}
.field label{display:block;margin-bottom:var(--s2);font-size:13px;line-height:16px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea{width:100%;outline:0;border:0;border-radius:var(--r-md);background:var(--surface);font-size:16px;line-height:24px}
.field input{height:var(--h-xl);padding:0 var(--s4)}
.field textarea{padding:var(--s4);resize:none;display:block}
.field input:focus,.field textarea:focus{box-shadow:inset 0 0 0 1.5px var(--p1)}
.photo{height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);position:relative;overflow:hidden;cursor:pointer;border-radius:var(--r-md);background:var(--surface);color:var(--mute);font-size:14px;line-height:20px}
.photo .px{width:32px;height:32px;vertical-align:0}
.photo img:not(.px){position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tagpick,.turf{display:flex;flex-wrap:wrap;gap:var(--s2)}
.tagpick button,.turf button{height:var(--h-md);padding:0 var(--s4);display:inline-flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:var(--surface);font-size:14px;line-height:20px;font-weight:500}
.tagpick button.on,.turf button.on{background:var(--p1);color:#fff}
.tagpick .px,.turf .px{width:20px;height:20px;vertical-align:0}
.toggle{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);cursor:pointer;border-radius:var(--r-md);background:var(--surface)}
.toggle b{font-size:14px;line-height:20px;font-weight:600}
.toggle b .px{width:16px;height:16px;vertical-align:-3px}
.toggle small{display:block;color:var(--mute)}
.toggle .sw{width:44px;height:28px;flex:none;position:relative;border-radius:var(--r-full);background:var(--surface-2);transition:.15s}
.toggle .sw::after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.toggle.on .sw{background:var(--pink)}
.toggle.on .sw::after{left:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.err{min-height:20px;margin-top:var(--s3);color:var(--danger);font-size:14px;line-height:20px;font-weight:500}
.bigstars{display:flex;justify-content:center;gap:var(--s2);margin-top:var(--s6)}
.bigstars button{width:48px;height:48px;font-size:40px;line-height:48px;color:#D4D4D8;transition:transform .1s}
.bigstars button.on{color:var(--star);transform:scale(1.06)}
.ratelbl{height:24px;margin-top:var(--s2);text-align:center;font-size:15px;line-height:24px;font-weight:600}

#crosshair{position:absolute;left:50%;top:50%;z-index:11;transform:translate(-50%,-50%);display:none;pointer-events:none}
#crosshair .bub{width:56px;height:56px;display:grid;place-items:center;border-radius:var(--r-full);background:var(--p1);box-shadow:0 0 0 8px rgba(9,9,11,.12);animation:pulse 1.4s ease-in-out infinite}
#crosshair .bub .px{width:36px;height:36px;vertical-align:0}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(9,9,11,.06)}}
#addbar{position:absolute;left:var(--gutter);right:var(--gutter);bottom:var(--s4);z-index:13;display:none;padding:var(--s5);border-radius:var(--r-lg);background:#fff;box-shadow:var(--float)}
#addbar p{margin:0 0 var(--s4);font-size:15px;line-height:20px}
#addbar .row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}

/* =========================================================
   PAGES
   ========================================================= */
.page{position:absolute;inset:0;z-index:11;display:none;overflow-y:auto;padding:var(--s8) var(--gutter) 120px;background:#fff}
.page.show{display:block}
.page .lead{margin:var(--s2) 0 0;color:var(--mute);font-size:14px;line-height:20px}
.sec{margin:var(--s8) 0 var(--s3)}
.phead{display:flex;align-items:center;gap:var(--s4)}
.bignum{margin-top:var(--s6);text-align:center}
.bignum small{color:var(--mute);font-size:13px}
.bignum b{display:block;font-family:var(--font-serif);font-weight:500;font-size:56px;line-height:60px;letter-spacing:0}
.podium{display:flex;justify-content:center;gap:var(--s5);margin-top:var(--s6)}
.pod{display:flex;flex-direction:column;align-items:center;gap:var(--s2);width:88px;text-align:center}
.pod .av{width:64px;height:64px;font-size:20px}.pod .av .px{width:40px;height:40px}
.pod.p1 .av{width:80px;height:80px;box-shadow:0 0 0 3px var(--ink)}.pod.p1 .av .px{width:40px;height:40px}
.pod b{font-size:13px;line-height:16px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod small{color:var(--mute)}
.list{display:flex;flex-direction:column}
.lrow{min-height:64px;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.me{margin:0 calc(-1 * var(--s3));padding:var(--s3);border-radius:var(--r-md);background:var(--surface);border-bottom:0}
.lrow .rk{width:24px;color:var(--mute);font-size:14px;line-height:20px;font-weight:600}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{display:block;font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm small{color:var(--mute)}
.lrow .pt{font-size:15px;line-height:20px;font-weight:600}
.empty{padding:var(--s8) var(--s4);text-align:center;color:var(--mute);font-size:14px;line-height:20px}
.empty.sm{padding:var(--s5) var(--s4)}
.empty .px.big{display:block;width:120px;height:120px;margin:0 auto var(--s4)}
.titlecard{margin-top:var(--s6);padding:var(--s5);border-radius:var(--r-lg);background:var(--surface)}
.titlecard small{color:var(--mute)}
.titlecard h2{margin-top:var(--s1)}
.bar{height:8px;margin-top:var(--s4);border-radius:var(--r-full);background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-full);background:var(--p1)}
.titlecard p{margin:var(--s3) 0 0;font-size:14px;line-height:20px;color:var(--ink-2)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s3)}
.stat{padding:var(--s4) var(--s3);border-radius:var(--r-lg);background:var(--surface)}
.stat b{display:block;font-family:var(--font-serif);font-weight:500;font-size:28px;line-height:32px}
.stat small{color:var(--mute)}
.impact{margin-top:var(--s3);padding:var(--s4);border-radius:var(--r-lg);background:var(--t-pink);font-size:14px;line-height:20px}
.impact .px{width:20px;height:20px}
.myspot{width:100%;display:flex;align-items:center;gap:var(--s3);min-height:72px;padding:var(--s3) 0;text-align:left;border-bottom:1px solid var(--line)}
.myspot .th{width:48px;height:48px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:var(--r-sm)}
.myspot .th img:not(.px){width:100%;height:100%;object-fit:cover}
.myspot .th .px{width:40px;height:40px;vertical-align:0}
.myspot b{font-size:15px;line-height:20px;font-weight:600}
.myspot small{display:block;color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.stack .btn{width:100%}
.note-sm{margin-top:var(--s4);color:var(--mute);font-size:12px;line-height:16px}

/* share */
#shareModal .wrap{padding:0 var(--gutter);text-align:center}
#shareModal .sub{margin-top:var(--s2);color:var(--mute);font-size:14px;line-height:20px}
#cardHolder{padding:var(--s8);color:var(--mute)}
#shareCanvas{display:block;width:100%;max-width:280px;margin:var(--s6) auto;border-radius:var(--r-lg);box-shadow:var(--float)}

/* =========================================================
   FLOW SCREENS
   ========================================================= */
.screen{position:absolute;inset:0;z-index:50;display:none;overflow-y:auto;overflow-x:hidden;background:#fff}
.screen.show{display:block;animation:scrIn .32s cubic-bezier(.2,.9,.25,1)}
.screen.back{animation:scrBack .32s cubic-bezier(.2,.9,.25,1)}
@keyframes scrIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes scrBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.f-top{height:72px;display:flex;align-items:center;gap:var(--s4);padding:0 var(--gutter)}
.skip{height:var(--h-md);color:var(--mute);font-size:14px;line-height:20px;font-weight:500}
/* segmented progress (stories style) */
.dots{flex:1;display:flex;gap:var(--s1)}
.dots i{flex:1;height:3px;border-radius:var(--r-full);background:var(--surface-2);overflow:hidden;position:relative}
.dots i.on,.dots i.past{background:var(--p1)}

/* welcome: one object, one headline, one action */
#landing{display:none;flex-direction:column}
#landing.show{display:flex}
.w-top{padding:var(--s4) var(--gutter) 0}
.w-top .dots{flex:none}
.w-top .dots i.fill{background:var(--surface-2)}
.w-top .dots i.fill::after{content:"";position:absolute;inset:0;background:var(--p1);transform-origin:left;animation:seg 4s linear forwards}
@keyframes seg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.w-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 var(--gutter);text-align:center;cursor:pointer;user-select:none}
.w-obj{width:200px;height:200px;display:grid;place-items:center;margin:0 auto var(--s8)}
.w-obj .px{width:200px;height:200px;vertical-align:0;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 16px 16px rgba(9,9,11,.08))}
.w-stage h1{max-width:360px;margin:0 auto;font-size:44px;line-height:48px;letter-spacing:-.03em}
.w-swap{width:100%;display:flex;flex-direction:column;align-items:center}
.w-stage p{margin:var(--s4) auto 0;max-width:296px;color:var(--ink-2);font-size:15px;line-height:20px}
.w-swap{animation:swap .45s cubic-bezier(.2,.9,.25,1)}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.w-bottom{padding:var(--s6) var(--gutter) var(--s8);text-align:center}
.w-bottom .logo{display:none}

/* auth */
.a-wrap{padding:0 var(--gutter) var(--s10)}
.a-art{width:120px;height:120px;margin:var(--s4) auto var(--s6);display:grid;place-items:center}
.a-art .px{width:120px;height:120px;vertical-align:0;animation:float 4s ease-in-out infinite}
.a-wrap h1{text-align:center}
.a-wrap .lead,.ob .lead{margin:var(--s3) auto var(--s8);max-width:320px;text-align:center;color:var(--mute);font-size:15px;line-height:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;height:var(--h-lg);margin-bottom:var(--s6);padding:var(--s1);border-radius:var(--r-md);background:var(--surface)}
.seg button{border-radius:var(--r-sm);font-size:14px;line-height:20px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.phone{height:var(--h-xl);display:flex;align-items:center;border-radius:var(--r-md);background:var(--surface)}
.phone:focus-within{box-shadow:inset 0 0 0 1.5px var(--p1)}
.phone span{padding:0 var(--s1) 0 var(--s4);font-weight:600}
.phone input{flex:1;min-width:0;height:100%;padding:0 var(--s3);border:0;outline:0;background:none;font-size:18px;line-height:24px}
.a-wrap .bigbtn{margin-top:var(--s3)}
.or{display:flex;align-items:center;gap:var(--s3);margin:var(--s6) 0 var(--s3);color:var(--mute);font-size:13px;line-height:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.fine{margin-top:var(--s6);text-align:center;color:var(--mute);font-size:12px;line-height:16px}
.otp{display:flex;justify-content:center;gap:var(--s3)}
.otp input{width:64px;height:72px;text-align:center;outline:0;border:0;border-radius:var(--r-md);background:var(--surface);font-family:var(--font-serif);font-weight:500;font-size:32px;line-height:40px}
.otp input:focus{box-shadow:inset 0 0 0 1.5px var(--p1)}
.otp.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.otp.ok input{background:var(--t-green);color:#1B7A10}
.democode{margin-top:var(--s4);text-align:center;color:var(--mute);font-size:13px;line-height:16px}
.democode b{color:var(--ink);letter-spacing:4px}
.resend{margin-top:var(--s6)}

/* onboarding */
.ob{min-height:calc(100% - 72px);display:flex;flex-direction:column;padding:var(--s2) var(--gutter) var(--s8)}
.ob h1{text-align:center}
.ob .grow{flex:1;min-height:var(--s6)}
.avbig{width:128px;height:128px;margin:0 auto var(--s6);display:grid;place-items:center;border-radius:var(--r-full);background:var(--t-orange)}
.avbig .px{width:80px;height:80px;vertical-align:0}
.avbig.bump{animation:pop2 .3s}
@keyframes pop2{50%{transform:scale(1.06)}}
.nick{width:100%;height:var(--h-xl);text-align:center;outline:0;border:0;border-radius:var(--r-md);background:var(--surface);font-family:var(--font-serif);font-weight:500;font-size:24px;line-height:32px}
.nick:focus{box-shadow:inset 0 0 0 1.5px var(--p1)}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-top:var(--s5)}
.avgrid button{aspect-ratio:1;display:grid;place-items:center;border-radius:var(--r-full);background:var(--surface);transition:transform .1s}
.avgrid button.on{background:var(--t-orange);box-shadow:0 0 0 2px var(--ink)}
.avgrid .px{width:40px;height:40px;vertical-align:0}
.deck{position:relative;height:376px;margin-bottom:var(--s6)}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s6);touch-action:none;user-select:none;cursor:grab;border-radius:var(--r-lg);background:var(--surface)}
.card .em{width:160px;height:160px;display:grid;place-items:center}
.card .em .px{width:160px;height:160px;vertical-align:0}
.card .fn{padding:0 var(--s5);text-align:center;font-family:var(--font-serif);font-weight:500;font-size:28px;line-height:32px;letter-spacing:0}
.card .stamp{position:absolute;top:var(--s6);height:var(--h-md);padding:0 var(--s4);display:flex;align-items:center;opacity:0;border-radius:var(--r-full);font-size:15px;line-height:20px;font-weight:700;letter-spacing:.06em;color:#fff}
.card .stamp.yum{left:var(--s5);background:var(--green)}
.card .stamp.nah{right:var(--s5);background:var(--p1)}
.card.under{transform:translateY(12px) scale(.95);background:var(--surface-2)}
.card.under2{transform:translateY(24px) scale(.9);background:var(--line)}
.swbtns{display:flex;justify-content:center;gap:var(--s6)}
.swbtns button{width:64px;height:64px;display:grid;place-items:center;border-radius:var(--r-full);background:var(--surface);font-size:22px;font-weight:600;transition:transform .1s}
.swbtns button.y{background:var(--p1)}
.swbtns .px{width:36px;height:36px;vertical-align:0}
.swbtns button:active{transform:scale(.94)}
.count{margin-top:var(--s4);text-align:center;color:var(--mute);font-size:13px;line-height:16px}
.result{padding-top:var(--s4);text-align:center}
.result .em{width:176px;height:176px;margin:0 auto var(--s6);display:grid;place-items:center}
.result .em .px{width:160px;height:160px;vertical-align:0;animation:float 4s ease-in-out infinite}
.result .lead{margin:0 auto}
.result h2{margin-top:var(--s2);font-size:40px;line-height:44px}
.result p{margin:var(--s3) auto 0;max-width:320px;color:var(--ink-2);font-size:15px;line-height:20px}
.spice{padding-top:var(--s2);text-align:center}
.spice .face{width:176px;height:176px;margin:0 auto;display:grid;place-items:center;transition:transform .2s}
.spice .face .px{width:160px;height:160px;vertical-align:0}
.spice .chillies{height:32px;margin-top:var(--s3);display:flex;justify-content:center;gap:var(--s1)}
.chillies .px{width:28px;height:28px;vertical-align:0}
.spice .lvl{margin-top:var(--s3);font-family:var(--font-serif);font-weight:500;font-size:32px;line-height:36px;letter-spacing:0}
.spice .desc{margin-top:var(--s1);color:var(--mute);font-size:15px;line-height:20px}
.spice input[type=range]{width:100%;height:8px;margin:var(--s8) 0 var(--s3);-webkit-appearance:none;appearance:none;outline:0;border-radius:var(--r-full);background:linear-gradient(90deg,var(--t-green),var(--orange),var(--danger))}
.spice input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--ink),0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.spice input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.spice .ends{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;line-height:16px}
.turf button.visit{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.done{padding-top:var(--s4);text-align:center}
.badgeRing{width:176px;height:176px;margin:0 auto var(--s6);display:grid;place-items:center;border-radius:var(--r-full);background:var(--t-orange);animation:spinIn .7s cubic-bezier(.2,1.4,.4,1)}
.badgeRing .px{width:120px;height:120px;vertical-align:0}
@keyframes spinIn{from{transform:scale(.4) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.done .tt{height:var(--h-sm);margin-bottom:var(--s4);padding:0 var(--s4);display:inline-flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:13px;line-height:16px;font-weight:600}
.done .tt .px{width:20px;height:20px;vertical-align:0}
.done .lead{margin:var(--s3) auto 0}
.done .lead .px{width:20px;height:20px}
.mission{margin-top:var(--s8);padding:var(--s5);text-align:left;border-radius:var(--r-lg);background:var(--surface);font-size:14px;line-height:20px;color:var(--ink-2)}
.mission b{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);color:var(--ink);font-size:15px;line-height:20px;font-weight:600}
.mission b .px{width:24px;height:24px;vertical-align:0}
#confetti{position:absolute;inset:0;z-index:60;pointer-events:none}
/* login art: steaming chai instead of the avatar */
.a-back{position:relative;width:120px;height:120px;margin:var(--s4) auto var(--s6);display:grid;place-items:center}
.a-back .px{width:120px;height:120px;vertical-align:0}
.steam{position:absolute;top:-8px;left:50%;transform:translateX(-50%);color:#A1A1AA;font-size:20px;letter-spacing:4px;animation:steam 2s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.2;transform:translate(-50%,4px)}50%{opacity:.8;transform:translate(-50%,-4px)}}
/* the foodie pact */
.ob h1+.lead{margin-bottom:var(--s6)}
.pact{position:relative;padding:var(--s5) var(--s4) var(--s4);border-radius:var(--r-lg);background:var(--surface)}
.pact-h{margin-bottom:var(--s3);font-family:var(--font-serif);font-size:20px;line-height:28px}
.pact-h b{font-weight:600}
.clause{width:100%;display:flex;align-items:center;gap:var(--s3);padding:var(--s3);margin-bottom:var(--s2);border-radius:var(--r-md);background:#fff;text-align:left;transition:transform .1s,box-shadow .15s}
.clause:active{transform:scale(.98)}
.clause .ci{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--surface)}
.clause .ci .px{width:40px;height:40px;vertical-align:0}
.clause .ct{flex:1;min-width:0}
.clause .ct b{display:block;font-size:14px;line-height:20px;font-weight:600}
.clause .ct small{display:block;color:var(--mute)}
.clause .ck{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:var(--r-full);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px;font-weight:700;color:#fff}
.clause.on{box-shadow:inset 0 0 0 1.5px var(--p1)}
.clause.on .ck{background:var(--p1);box-shadow:none;animation:pop2 .25s}
.sigwrap{position:relative;height:120px;margin-top:var(--s4);border-radius:var(--r-md);background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.sigwrap.locked{opacity:.5}
.sigwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sigph{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#A1A1AA;font-size:14px;line-height:20px;pointer-events:none;transition:opacity .2s}
.sigclr{position:absolute;right:var(--s2);top:var(--s2);height:var(--h-sm);padding:0 var(--s3);border-radius:var(--r-full);background:var(--surface);font-size:12px;line-height:16px;font-weight:600}
.sigline{display:flex;justify-content:space-between;margin-top:var(--s2);padding-top:var(--s2);border-top:1px dashed #A1A1AA;color:var(--mute);font-size:12px;line-height:16px}
.sealed{position:absolute;right:var(--s4);bottom:var(--s12);padding:var(--s2) var(--s4);border:3px solid var(--pink);border-radius:var(--r-sm);color:var(--pink);font-family:var(--font-serif);font-size:24px;line-height:32px;font-weight:600;transform:rotate(-12deg) scale(2.4);opacity:0;pointer-events:none;background:rgba(255,255,255,.85)}
.sealed.show{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-12deg) scale(1);opacity:1}}
/* ===== welcome micro-interactions ===== */
.w-obj{position:relative;perspective:600px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.w-obj .w-spr{display:block;width:200px;height:200px;transform-style:preserve-3d}
.w-obj .w-spr.map2{transform-style:flat}
.w-obj .w-spr .px{animation:none}
.w-obj .fx{position:absolute;inset:0;pointer-events:none}
.w-obj .fx i{position:absolute;display:block}
/* pan: toss + food hopping + pixel steam */
.anim-cook .w-spr{transform-origin:55% 62%;animation:toss 1.4s cubic-bezier(.4,0,.3,1) infinite}
@keyframes toss{0%,100%{transform:rotate(0) translate(0,0)}18%{transform:rotate(-9deg) translate(-4px,4px)}36%{transform:rotate(7deg) translate(4px,-8px)}52%{transform:rotate(-3deg) translate(0,0)}68%{transform:rotate(0) translate(0,0)}}
.bit{left:var(--x);top:112px;width:10px;height:10px;background:var(--c);z-index:2;image-rendering:pixelated;animation:hop 1.4s var(--d) cubic-bezier(.3,0,.7,1) infinite}
@keyframes hop{0%,30%{transform:translate(0,0) rotate(0);opacity:0}34%{opacity:1}52%{transform:translate(4px,calc(-1 * var(--h))) rotate(var(--r));opacity:1}70%{transform:translate(0,0) rotate(calc(var(--r) * 2));opacity:1}74%,100%{transform:translate(0,0);opacity:0}}
.steam-px{left:var(--x);top:72px;width:8px;height:8px;background:#D4D4D8;box-shadow:8px -8px 0 #E4E4E7,0 -16px 0 #D4D4D8;animation:steamUp 1.8s var(--d) steps(6) infinite}
@keyframes steamUp{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-40px);opacity:0}}
/* map: tumble flip on X + landing ping */
.map2{position:relative}
.map2 .lay{position:absolute;inset:0;display:block}
.map2 .lay .px{width:200px;height:200px}
.pinl{transform-origin:53.75% 62.5%;animation:pinSpin 2.4s cubic-bezier(.45,0,.3,1) infinite;z-index:2}
@keyframes pinSpin{0%,20%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-24px) rotateY(180deg)}62%{transform:translateY(0) rotateY(360deg)}68%{transform:translateY(-6px) rotateY(360deg)}74%,100%{transform:translateY(0) rotateY(360deg)}}
.anim-map .fx{z-index:1}
.map2 .lay:first-child{z-index:0}
.anim-map .fx{z-index:1}.map2 .pinl{z-index:3}
.pshadow{left:53.75%;top:62.5%;width:40px;height:12px;margin:-8px 0 0 -20px;background:rgba(60,40,20,.35);clip-path:polygon(20% 0,80% 0,100% 33%,100% 67%,80% 100%,20% 100%,0 67%,0 33%);animation:pshadow 2.4s cubic-bezier(.45,0,.3,1) infinite}
@keyframes pshadow{0%,20%{transform:scale(1);opacity:1}45%{transform:scale(.5);opacity:.5}62%{transform:scale(1);opacity:1}68%{transform:scale(.8)}74%,100%{transform:scale(1)}}
.ring{left:53.75%;top:62.5%;width:24px;height:8px;margin:-4px 0 0 -12px;border:4px solid var(--pink);opacity:0;animation:ping 2.4s ease-out infinite}
.ring.r2{animation-delay:.2s;border-color:var(--blue)}
@keyframes ping{0%,60%{transform:scale(.4);opacity:0}63%{opacity:.9}92%,100%{transform:scale(5,3);opacity:0}}
/* trophy: 3D coin-style spin + pixel sparkles */
.anim-flip .w-spr{animation:spinY 2.8s cubic-bezier(.6,0,.4,1) infinite}
@keyframes spinY{0%,25%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-12px)}75%,100%{transform:rotateY(360deg) translateY(0)}}
.spark{left:var(--x);top:var(--y);width:8px;height:8px;background:var(--star);box-shadow:8px 0 0 var(--star),-8px 0 0 var(--star),0 8px 0 var(--star),0 -8px 0 var(--star);animation:twinkle 1.4s var(--d) steps(3) infinite}
@keyframes twinkle{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
/* tap: kick + quip */
.w-obj.kick .w-spr{animation-duration:.7s}
.w-obj.kick{animation:kick .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes kick{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-4deg)}100%{transform:scale(1)}}
.quip{position:absolute;left:50%;top:-8px;transform:translateX(-50%);padding:var(--s1) var(--s3);border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:13px;line-height:20px;font-weight:600;white-space:nowrap;pointer-events:none;animation:quip .9s ease-out forwards}
@keyframes quip{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-32px)}}
/* pixel avatars */
.avimg{display:block;width:100%;height:100%;image-rendering:pixelated;object-fit:cover}
.av,.hello .me,.avbig,.badgeRing{overflow:hidden}
.av .avimg,.hello .me .avimg,.pod .av .avimg{width:100%;height:100%}
.avbig.avmain{width:160px;height:160px;cursor:pointer}
.shuf{height:var(--h-md);margin:0 auto var(--s5);padding:0 var(--s4);display:flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:var(--surface);font-size:14px;line-height:20px;font-weight:600}
.shuf .px{width:20px;height:20px;vertical-align:0}
.avtabs{display:flex;gap:var(--s2);overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter) var(--s1);scrollbar-width:none}
.avtabs::-webkit-scrollbar{display:none}
.avtabs button{flex:none;height:var(--h-md);padding:0 var(--s4);border-radius:var(--r-full);background:var(--surface);font-size:14px;line-height:20px;font-weight:500;white-space:nowrap}
.avtabs button.on{background:var(--p1);color:#fff}
.avopts{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-top:var(--s4)}
.avopts.sw{grid-template-columns:repeat(6,1fr)}
.avopt{display:flex;flex-direction:column;align-items:center;gap:var(--s1);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2)}
.avopt .avimg{width:64px;height:64px;border-radius:50%}
.avopt.on .avimg{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.swatch{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.a-art.av-shuffle{width:120px;height:120px;border-radius:50%;overflow:hidden}
.badgeRing .avimg{width:100%;height:100%}
/* ===== sticky CTA bars + top bars ===== */
.ctabar{position:sticky;bottom:0;z-index:5;display:grid;gap:var(--s2);margin:0 calc(-1 * var(--gutter));padding:var(--s3) var(--gutter) var(--s6);background:linear-gradient(rgba(255,255,255,0),#fff var(--s4))}
.ob,.a-wrap{min-height:calc(100% - 64px);display:flex;flex-direction:column;padding-bottom:0}
.ob .grow,.a-wrap .grow{flex:1;min-height:var(--s6)}
.a-wrap .bigbtn{margin-top:0}
.form .actions,#shareModal .actions{position:sticky;bottom:calc(-1 * var(--s8));z-index:5;margin:var(--s6) calc(-1 * var(--gutter)) 0;padding:var(--s3) var(--gutter) var(--s8);background:linear-gradient(rgba(255,255,255,0),#fff var(--s4))}
.form .actions .btn,#shareModal .actions .btn{height:var(--h-xl)}
.f-top{position:sticky;top:0;z-index:6;height:64px;background:#fff;border-bottom:1px solid var(--line)}
.backbtn{width:40px;height:40px;flex:none;border-radius:var(--r-full);background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.backbtn svg{width:20px;height:20px}
.backbtn:hover{box-shadow:inset 0 0 0 1.5px var(--p1)}
.ob{padding-top:var(--s5)}
.a-wrap{padding-top:var(--s5)}
/* ===== onboarding v3: progress, avatar builder, nudges, welcome ===== */
.ob-top{height:72px}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--s2)}
.ptxt{display:flex;align-items:center;gap:var(--s2);font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden}
.ptxt b{font-weight:700}
.ptxt span{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.ptxt em{flex:none;height:20px;padding:0 var(--s2);display:inline-flex;align-items:center;border-radius:var(--r-full);background:var(--t-blue);color:#1E4FD6;font-style:normal;font-size:11px;line-height:16px;font-weight:600}
.ob-top .dots{flex:none;display:flex;gap:var(--s1)}
.ob-top .dots i{flex:1;height:6px;border-radius:var(--r-full);background:var(--surface-2)}
.ob-top .dots i.past{background:var(--p1)}
.ob-top .dots i.on{background:linear-gradient(90deg,var(--ink) 50%,var(--surface-2) 50%)}
.skip{flex:none;height:var(--h-md);padding:0 var(--s3);border-radius:var(--r-full);background:var(--surface);color:var(--ink);font-size:13px;line-height:16px;font-weight:600}
.hint{margin:var(--s2) 0 0;text-align:center;color:var(--mute);font-size:12px;line-height:16px}
.subprog{display:flex;justify-content:center;gap:var(--s1);margin-bottom:var(--s4)}
.subprog span{height:24px;padding:0 var(--s3);display:flex;align-items:center;border-radius:var(--r-full);background:var(--surface);color:var(--mute);font-size:12px;line-height:16px;font-weight:600}
.subprog span.past{color:var(--ink)}
.subprog span.on{background:var(--p1);color:#fff}
.avstage{display:flex;flex-direction:column;align-items:center;margin-bottom:var(--s2)}
.avstage .avbig{margin-bottom:var(--s3)}
.avstage .shuf{margin:0}
.vibes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.vibe{display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s3) var(--s2) var(--s4);border-radius:var(--r-lg);background:var(--surface)}
.vibe .avimg{width:80px;height:80px;border-radius:50%}
.vibe b{font-size:14px;line-height:20px}
.vibe.on{background:#fff;box-shadow:inset 0 0 0 2px var(--p1)}
.swgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);margin-top:var(--s4);padding:0 var(--s4)}
.swgrid .swatch{width:100%}
.swrow{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--s2)}
.sec-l{margin:var(--s5) 0 var(--s3);font-size:13px;line-height:16px;font-weight:700;color:var(--ink-2)}
.avopts{margin-top:0}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.look{aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;transition:transform .1s}
.look .avimg{border-radius:var(--r-lg)}
.look.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);transform:scale(.97)}
.lookrow{display:flex;justify-content:center;gap:var(--s2);margin-top:var(--s4)}
.lookrow .shuf{margin:0}
/* header bell */
.bell{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:var(--r-full);background:var(--surface)}
.bell svg{width:20px;height:20px}
#bellBadge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 var(--s1);display:none;place-items:center;border-radius:var(--r-full);background:var(--pink);color:#fff;font-size:11px;line-height:16px;font-weight:700;box-shadow:0 0 0 2px #fff}
/* setup pill on map */
.setup-pill{position:absolute;left:var(--gutter);bottom:248px;z-index:10;height:var(--h-md);padding:0 var(--s4) 0 var(--s2);display:none;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:13px;line-height:16px;box-shadow:var(--float)}
.setup-pill b{font-weight:600}.setup-pill span:last-child{color:#A1A1AA}
.setup-pill .ring{width:24px;height:24px;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p) * 1%),#3F3F46 0);-webkit-mask:radial-gradient(circle,transparent 7px,#000 8px);mask:radial-gradient(circle,transparent 7px,#000 8px)}
/* checklist sheet */
.clbar{height:8px;margin-top:var(--s4);border-radius:var(--r-full);background:var(--surface-2);overflow:hidden}
.clbar i{display:block;height:100%;border-radius:var(--r-full);background:var(--p1)}
.cl{margin-top:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.clrow{display:flex;align-items:center;gap:var(--s3);min-height:72px;padding:var(--s3);border-radius:var(--r-md);background:var(--surface);text-align:left}
.clrow .ci{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:var(--r-sm);background:#fff}
.clrow .ci .px{width:40px;height:40px}
.clrow .ct{flex:1;min-width:0}
.clrow b{display:flex;align-items:center;gap:var(--s2);font-size:15px;line-height:20px;font-weight:600}
.clrow b em{height:20px;padding:0 var(--s2);display:inline-flex;align-items:center;border-radius:var(--r-full);background:var(--t-pink);color:#C2185B;font-style:normal;font-size:11px;font-weight:700}
.clrow small{display:block;color:var(--mute)}
.clrow .ck{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:var(--r-full);background:#fff;font-weight:700}
.clrow.ok{opacity:.6}.clrow.ok .ck{background:var(--green);color:#fff}
.gate{text-align:center}
.gate-ic{width:96px;height:96px;margin:var(--s2) auto var(--s4);display:grid;place-items:center}
.gate-ic .px{width:80px;height:80px;animation:float 3s ease-in-out infinite}
/* push-style notification */
.push{position:absolute;left:var(--s3);right:var(--s3);top:var(--s3);z-index:90;display:flex;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-lg);background:rgba(255,255,255,.96);box-shadow:0 12px 32px rgba(9,9,11,.16);backdrop-filter:blur(12px);text-align:left;cursor:pointer;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
.push.show{transform:none}
.push .pi{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--p1)}
.push .pi .px{width:28px;height:28px}
.push .pt{flex:1;min-width:0;font-size:14px;line-height:20px}
.push small{display:block;color:var(--mute)}
.push b{display:block;font-weight:600}
.push .pt>span{color:var(--ink-2)}
/* welcome pop-up */
.welcome{position:absolute;inset:0;z-index:85;display:none;align-items:flex-end;background:rgba(9,9,11,.4)}
.welcome.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.wcard{position:relative;width:100%;padding:var(--s6) var(--gutter) var(--s8);border-radius:var(--r-lg) var(--r-lg) 0 0;background:#fff;text-align:center;animation:sheetUp .4s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.wskip{position:absolute;top:var(--s4);right:var(--s4);height:var(--h-sm);padding:0 var(--s3);border-radius:var(--r-full);background:var(--surface);font-size:13px;font-weight:600}
.wav{height:0}
.wav .avimg{position:absolute;top:-32px;left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;box-shadow:0 0 0 4px #fff}
.wobj{height:160px;display:grid;place-items:center;margin-top:var(--s4)}
.wobj .px{width:160px;height:160px;animation:float 4s ease-in-out infinite}
.wdots{display:flex;justify-content:center;gap:var(--s1);margin:var(--s4) 0}
.wdots i{width:8px;height:8px;border-radius:var(--r-full);background:var(--surface-2);transition:width .2s}
.wdots i.on{width:24px;background:var(--p1)}
.wcard h2{font-size:28px;line-height:32px}
.wcard p{max-width:320px;margin:var(--s3) auto var(--s6);color:var(--ink-2);font-size:15px;line-height:20px}
/* A/B card */
.abcard{margin-top:var(--s3);padding:var(--s4);border-radius:var(--r-lg);background:var(--surface);font-size:13px;line-height:20px}
.abcard table{width:100%;border-collapse:collapse;margin-top:var(--s2)}
.abcard td,.abcard th{padding:var(--s1) 0;text-align:left}
.abcard th{color:var(--mute);font-weight:500}
/* avatar v3: who → make it you */
.who{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.whoc{display:flex;flex-direction:column;align-items:center;gap:var(--s3);padding:var(--s5) var(--s3);border-radius:var(--r-lg);background:var(--surface);transition:transform .1s,box-shadow .15s}
.whoc .avimg{width:120px;height:120px;border-radius:50%}
.whoc b{font-family:var(--font-serif);font-weight:500;font-size:24px;line-height:28px}
.whoc:active{transform:scale(.97)}.whoc:hover{box-shadow:inset 0 0 0 2px var(--p1)}
.whoalt{display:block;height:var(--h-lg);margin:var(--s4) auto 0;padding:0 var(--s4);color:var(--mute);font-size:14px;line-height:20px;text-decoration:underline;text-underline-offset:4px}
.av2{padding-top:0}
.avsticky{position:sticky;top:72px;z-index:4;display:flex;align-items:center;gap:var(--s4);margin:0 calc(-1 * var(--gutter));padding:var(--s4) var(--gutter);background:#fff;border-bottom:1px solid var(--line)}
.avsticky .avbig{width:112px;height:112px;margin:0;flex:none}
.avside h2{font-size:24px;line-height:28px}
.avside p{margin:var(--s1) 0 var(--s3);color:var(--mute);font-size:13px;line-height:16px}
.avside .shuf{margin:0;height:var(--h-sm)}
.avopts.sm{grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.avopts.sm .avimg{width:56px;height:56px}
.swrow.mt{margin-top:var(--s3)}
/* tinder taste test */
.tinder{padding-top:var(--s3)}
.tt-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s3)}
.tt-head span{color:var(--mute);font-size:13px;font-weight:600}
.tinder .deck{height:400px;margin-bottom:var(--s4)}
.tcard{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;border-radius:var(--r-lg);background:#fff;box-shadow:0 12px 32px rgba(9,9,11,.12),0 0 0 1px var(--line);touch-action:none;user-select:none;cursor:grab;will-change:transform}
.tcard.under{transform:translateY(10px) scale(.95);box-shadow:0 0 0 1px var(--line)}
.tcard.under2{transform:translateY(20px) scale(.9);box-shadow:0 0 0 1px var(--line)}
.tpic{position:relative;flex:1;display:grid;place-items:center}
.tpic .px{width:200px;height:200px}
.tpic .stamp{position:absolute;top:var(--s5);height:var(--h-md);padding:0 var(--s4);display:flex;align-items:center;opacity:0;border-radius:var(--r-sm);border:3px solid;font-family:var(--font-serif);font-size:22px;font-weight:600;background:rgba(255,255,255,.9)}
.tpic .stamp.yum{left:var(--s5);color:var(--green);rotate:-14deg}
.tpic .stamp.nah{right:var(--s5);color:var(--danger);rotate:14deg}
.tinfo{padding:var(--s4) var(--s5) var(--s5)}
.ttag{display:inline-flex;height:24px;padding:0 var(--s2);align-items:center;border-radius:var(--r-full);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2)}
.tinfo h3{margin-top:var(--s2);font-family:var(--font-serif);font-size:24px;line-height:28px;font-weight:500}
.tinfo p{margin:var(--s1) 0 0;color:var(--ink-2);font-size:14px;line-height:20px}
.tinder .swbtns{align-items:center;gap:var(--s4)}
.swbtns .nah,.swbtns .yum{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 6px 16px rgba(9,9,11,.1),0 0 0 1px var(--line)}
.swbtns .nah{color:var(--danger)}.swbtns .yum{color:var(--green)}
.swbtns svg{width:28px;height:28px}
.swhint{color:var(--mute);font-size:12px;font-weight:600}
.plate{margin-top:var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r-lg);background:var(--surface)}
.plabel{font-size:12px;line-height:16px;font-weight:600;color:var(--ink-2)}
.plabel b{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:var(--s1);border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:11px}
.pitems{display:flex;flex-wrap:wrap;gap:var(--s1);min-height:32px;margin-top:var(--s2);align-items:center}
.pitems i{width:32px;height:32px;display:grid;place-items:center;animation:pop2 .3s}
.pitems .px{width:32px;height:32px}
.pitems em{color:var(--mute);font-size:13px;font-style:normal}
.flyer{position:absolute;z-index:95;pointer-events:none;transition:all .5s cubic-bezier(.5,0,.3,1)}
.flyer .px{width:100%;height:100%}
/* spice v2 */
.spice .face{width:176px;height:176px;border-radius:50%;overflow:hidden;transition:background .25s,transform .2s}
.spice .face .avimg{width:100%;height:100%}
.spice .chillies{gap:var(--s2);height:40px;margin-top:var(--s4)}
.chl{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--surface);opacity:.35;filter:grayscale(1);transition:all .2s}
.chl .px{width:32px;height:32px}
.chl.on{opacity:1;filter:none;background:var(--t-pink);animation:pop2 .25s}
.chl.fire.on{background:#FFE3CC}
.spice .ends span{flex:1;text-align:center}
.spice .ends span:first-child{text-align:left}.spice .ends span:last-child{text-align:right}
/* turf search */
.tsearch{height:var(--h-xl);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);border-radius:var(--r-md);background:var(--surface)}
.tsearch:focus-within{box-shadow:inset 0 0 0 1.5px var(--p1)}
.tsearch svg{width:20px;height:20px;color:var(--mute);flex:none}
.tsearch input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;line-height:24px}
.tlist{display:flex;flex-direction:column;gap:var(--s2)}
.trow{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:var(--s2) var(--s3);border-radius:var(--r-md);background:var(--surface);text-align:left}
.trow.on{background:#fff;box-shadow:inset 0 0 0 2px var(--p1)}
.trow .tic{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-sm);background:#fff}
.trow .tic .px{width:32px;height:32px}
.trow .tt{flex:1}.trow b{display:block;font-size:15px;line-height:20px;font-weight:600}.trow small{color:var(--mute)}
.trow .tck{width:24px;font-weight:700}
/* avatar v4: one category at a time */
.av3{padding-top:var(--s4)}
.av3-stage{position:relative;width:160px;height:160px;margin:0 auto}
.av3-stage .avbig{width:160px;height:160px;margin:0}
.dice{position:absolute;right:-8px;bottom:0;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:var(--float),0 0 0 1px var(--line);transition:transform .2s}
.dice:active{transform:rotate(-30deg) scale(.92)}
.dice .px{width:28px;height:28px}
.av3-hint{margin:var(--s3) 0 var(--s5);text-align:center;color:var(--mute);font-size:13px;line-height:16px}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s1);padding:var(--s1);border-radius:var(--r-md);background:var(--surface)}
.seg5 button{height:var(--h-md);border-radius:var(--r-sm);font-size:13px;line-height:16px;font-weight:600;color:var(--mute);transition:background .15s,color .15s}
.seg5 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.av3-panel{min-height:200px;padding-top:var(--s5);animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}}
.av3 .swgrid{margin-top:0}
.avopts.three{grid-template-columns:repeat(3,1fr)}
.avopts.sm.mt{margin-top:var(--s4)}
/* tinder v2 */
.tinder{min-height:calc(100% - 72px)}
.tinder .deck{position:relative;flex:1;height:auto;min-height:360px;max-height:520px;margin-bottom:var(--s4)}
.tinder .tray{margin-top:auto;padding-top:var(--s5)}
.tcard{transform-origin:50% 120%;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s}
.tcard.d1{transform:translateY(12px) scale(.95);box-shadow:0 0 0 1px var(--line)}
.tcard.d2{transform:translateY(24px) scale(.9);box-shadow:0 0 0 1px var(--line);opacity:.6}
.tcard.d0{box-shadow:0 12px 32px rgba(9,9,11,.12),0 0 0 1px var(--line)}
.tcard.grab{box-shadow:0 24px 48px rgba(9,9,11,.18),0 0 0 1px var(--line)}
.tcard img,.slot img,.flyer img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.tico{display:grid;place-items:center;transition:transform .2s;animation:float 3.5s ease-in-out infinite}
.tcard.grab .tico{animation:none}
.tico .px{width:200px;height:200px}
.tinder .swbtns{justify-content:center;gap:var(--s8)}
.swbtns .nah{transform:scale(var(--nah,1));transition:transform .15s}
.swbtns .yum{transform:scale(var(--yum,1));transition:transform .15s}
.swbtns .hit{animation:hit .35s}
@keyframes hit{40%{transform:scale(1.25)}}
.tray{position:sticky;bottom:0;z-index:5;margin:var(--s4) calc(-1 * var(--gutter)) 0;padding:var(--s3) var(--gutter) var(--s5);background:linear-gradient(rgba(255,255,255,0),#fff 12px)}
.tray.final{position:static;margin:var(--s5) 0 0;padding:0;background:none}
.tray-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2);font-size:13px;line-height:16px}
.tray-h span{color:var(--mute);font-weight:600}
.tray-h span.bump{animation:pop2 .3s;color:var(--green)}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--s1);padding:var(--s2);border-radius:var(--r-md);background:var(--surface)}
.slot{aspect-ratio:1;display:grid;place-items:center;border-radius:var(--r-sm);border:1.5px dashed #D4D4D8;position:relative}
.slot .px{width:80%;height:80%}
.slot.now{border:1.5px solid var(--ink);animation:pulseSlot 1.2s ease-in-out infinite}
@keyframes pulseSlot{50%{transform:scale(1.08)}}
.slot.yum{border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.slot.nah{border:0;background:transparent}.slot.nah .px{opacity:.25;filter:grayscale(1)}
.slot.nah::after{content:"";position:absolute;left:20%;right:20%;top:50%;height:2px;background:var(--danger);transform:rotate(-35deg);opacity:.6}
.slot.land{animation:land .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(.6)}100%{transform:scale(1)}}
/* ===== polish pass ===== */
/* orchestrated entrance per step */
.enter{animation:enterUp .5s cubic-bezier(.2,.9,.25,1) both}
.enter:nth-child(2){animation-delay:.06s}.enter:nth-child(3){animation-delay:.12s}.enter:nth-child(4){animation-delay:.18s}
@keyframes enterUp{from{opacity:0;transform:translateY(12px)}}
.ob-top .dots i{transition:background .4s}
.bigbtn:not(:disabled){transition:transform .1s,opacity .2s,background .2s}
.bigbtn:not(:disabled):active{transform:scale(.97)}
/* centred section titles */
.sec-c{display:flex;align-items:center;gap:var(--s3);margin:var(--s5) 0 var(--s3);color:var(--mute);font-size:12px;line-height:16px;font-weight:600}
.sec-c::before,.sec-c::after{content:"";flex:1;height:1px;background:var(--line)}
.av3-panel .sec-c:first-child{margin-top:0}
.turf{justify-content:center}
.tt-head{flex-direction:column;align-items:center;gap:var(--s1);text-align:center}
.tt-head span{height:24px;padding:0 var(--s3);display:inline-flex;align-items:center;border-radius:var(--r-full);background:var(--surface)}
/* pact v2 */
.doc{position:relative;margin-top:var(--s6);padding:var(--s5) var(--s4) var(--s4);border-radius:var(--r-lg);background:#FFFDF7;box-shadow:0 0 0 1px #EFE9DA,0 12px 32px rgba(9,9,11,.06)}
.doc.nudge{animation:shake .35s}
.doc-h{display:flex;align-items:center;justify-content:space-between;padding-bottom:var(--s3);margin-bottom:var(--s3);border-bottom:1px dashed #E5DDC8}
.doc-h .logo i{width:24px;height:24px;border-radius:8px}.doc-h .logo i .px{width:18px;height:18px}.doc-h .logo b{font-size:18px;line-height:24px}
.doc-h small{color:var(--mute)}
.doc-t{margin-bottom:var(--s3);text-align:center;font-family:var(--font-serif);font-size:20px;line-height:28px}
.doc-t b{font-weight:600}
.pactv .clause{background:#fff;box-shadow:0 0 0 1px #EFE9DA}
.clause .cn{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:var(--r-full);background:var(--surface);font-size:12px;font-weight:700;color:var(--mute);transition:all .2s}
.clause.on .cn{background:var(--p1);color:#fff}
.clause .ck{color:transparent;transition:all .2s}
.clause .ck svg{width:14px;height:14px}
.clause.on .ck{color:#fff}
.clause.tapped{animation:pop2 .25s}
.agree{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);color:var(--mute);font-size:12px;font-weight:600}
.abar{flex:1;height:6px;border-radius:var(--r-full);background:var(--surface-2);overflow:hidden}
.abar i{display:block;height:100%;border-radius:var(--r-full);background:var(--green);transition:width .3s}
.signbox{margin-top:var(--s5);padding:var(--s4);border-radius:var(--r-lg);background:var(--surface);transition:opacity .3s,box-shadow .3s}
.signbox.locked{opacity:.55}
.signbox.signed{box-shadow:inset 0 0 0 2px var(--green)}
.sign-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.sign-h b{font-size:15px;line-height:20px}
.signbox .sigclr{position:static}
.signbox .sigwrap{height:200px;margin:0;background:#fff;box-shadow:none;border-radius:var(--r-md)}
.signbox .sigwrap::after{content:"";position:absolute;left:var(--s5);right:var(--s5);bottom:48px;border-bottom:1.5px dashed #D4D4D8;pointer-events:none}
.sigx{position:absolute;left:var(--s5);bottom:52px;color:#A1A1AA;font-size:18px;font-weight:700;pointer-events:none;transition:opacity .2s}
.signbox .sigph{top:auto;bottom:16px;transform:none}
.signbox .sigline{border-top:0;margin-top:var(--s2);padding-top:0}
/* seal animation */
.sealfx{position:absolute;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s6);background:rgba(255,255,255,.88);backdrop-filter:blur(4px);animation:fadeIn .2s}
.sealfx.out{animation:fadeOut .3s forwards}
@keyframes fadeOut{to{opacity:0}}
.seal{position:relative;width:200px;height:200px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF6FB5,#E3237F 60%,#B5115F);box-shadow:0 0 0 6px #fff,0 0 0 8px #E3237F,0 24px 48px rgba(227,35,127,.35);animation:stampIn .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes stampIn{0%{transform:scale(3) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.sring{position:absolute;inset:0;width:100%;height:100%;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sring text{fill:#fff;font-family:var(--font-ui);font-size:13px;font-weight:700;letter-spacing:2px}
.score{width:96px;height:96px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.18)}
.score .px{width:80px;height:80px}
.sealtxt{text-align:center;animation:enterUp .4s .45s both}
.sealtxt b{display:block;font-family:var(--font-serif);font-size:28px;line-height:32px;font-weight:500}
.sealtxt span{color:var(--mute);font-size:15px}
.thud{animation:thud .35s}
@keyframes thud{25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.bit-fx{position:absolute;z-index:96;width:10px;height:10px;pointer-events:none}
/* swipe polish */
.tcard{transform-origin:50% 100%}
.tcard.arrive{animation:arrive .35s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(36px) scale(.86)}}
.tcard.gone{pointer-events:none;z-index:5}
.tico{transform:rotate(var(--tilt,0deg)) scale(var(--grow,1))}
.tico .px{animation:float 3.5s ease-in-out infinite}
.tcard.grab .tico .px{animation:none}
/* spice v3 */
.heat{position:relative;margin-top:var(--s6);padding:var(--s6) var(--s4) var(--s5);border-radius:var(--r-lg);background:var(--hb);text-align:center;overflow:hidden;transition:background .35s}
.hface{width:144px;height:144px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px rgba(255,255,255,.7);background:#fff}
.hface .avimg{width:100%;height:100%}
.hface.pop{animation:pop2 .3s}
.hface.shake{animation:shakeHard .5s ease-in-out infinite}
@keyframes shakeHard{25%{transform:translate(-3px,1px) rotate(-3deg)}75%{transform:translate(3px,-1px) rotate(3deg)}}
.heat .lvl{margin-top:var(--s4);font-family:var(--font-serif);font-size:32px;line-height:36px;font-weight:500}
.heat .lvl.swap{animation:enterUp .3s}
.heat .desc{margin-top:var(--s1);color:var(--ink-2);font-size:15px;line-height:20px}
.flames{position:absolute;left:0;right:0;bottom:0;height:100%;pointer-events:none;opacity:0;transition:opacity .3s}
.heat.l3 .flames,.heat.l4 .flames{opacity:1}
.flames i{position:absolute;bottom:-12px;left:var(--x);width:10px;height:10px;background:#FF8A00;box-shadow:0 -10px 0 #FFB000,0 -20px 0 rgba(255,210,63,.7);animation:flame 1.6s var(--d) ease-in infinite}
.heat.l4 .flames i{background:#FF4F2E;animation-duration:1.1s}
@keyframes flame{0%{transform:translateY(0) scale(1);opacity:.9}100%{transform:translateY(-140px) scale(.3);opacity:0}}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2);align-items:end;margin-top:var(--s5);padding:var(--s3);border-radius:var(--r-lg);background:var(--surface);touch-action:none;outline:none}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--s1);height:120px}
.bar i{display:block;width:100%;height:var(--h);border-radius:var(--r-sm);background:var(--surface-2);transition:background .2s,transform .2s}
.bar.on i{background:var(--c)}
.bar.sel i{transform:scaleY(1.06);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.bar .bi{height:32px;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:all .2s}
.bar.sel .bi{opacity:1;transform:none;animation:float 2s ease-in-out infinite}
.bar .bi .px{width:32px;height:32px}
.bar small{font-size:11px;line-height:16px;font-weight:600;color:var(--mute);white-space:nowrap}
.bar.sel small{color:var(--ink)}
/* turf v3 */
.turfv .tsearch{margin-top:var(--s6)}
.turfv #turfList{margin-top:var(--s1)}
.turfv .sec-c{margin:var(--s6) 0 var(--s4)}
.turf button{transition:transform .12s,background .15s}
.turf button.on{transform:scale(1.04)}
/* done v2 */
.donev{justify-content:flex-start;padding-top:var(--s10)}
.donev .done{padding-top:0}
.sunwrap{position:relative;width:200px;height:200px;margin:0 auto var(--s4);display:grid;place-items:center}
.sunburst{position:absolute;inset:-24px;border-radius:50%;background:repeating-conic-gradient(#FFE4F1 0 12deg,#fff 12deg 24deg);animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 55%,transparent 72%);mask:radial-gradient(circle,#000 55%,transparent 72%)}
.donev .badgeRing{position:relative;width:160px;height:160px;margin:0;box-shadow:0 0 0 6px #fff,0 16px 32px rgba(9,9,11,.12)}
.badgeRing.hop{animation:spinIn .7s cubic-bezier(.2,1.4,.4,1),hop 1.6s 1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-4deg)}50%{transform:translateY(0)}60%{transform:translateY(-6px) rotate(3deg)}}
.kicker{display:inline-block;margin-bottom:var(--s2);font-family:var(--font-serif);font-size:15px;letter-spacing:.2em;font-weight:600;background:linear-gradient(90deg,#FF3E9A,#FF7A1A,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent;animation:enterUp .4s .2s both}
.donev h1{animation:enterUp .45s .3s both}
.donev .tt{margin:var(--s4) 0 0;animation:enterUp .4s .4s both}
.stickers{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);margin-top:var(--s4)}
.stk2{height:var(--h-md);padding:0 var(--s4);display:inline-flex;align-items:center;gap:var(--s2);border-radius:var(--r-full);background:#fff;box-shadow:0 0 0 1px var(--line),0 6px 16px rgba(9,9,11,.06);font-size:14px;font-weight:600;transform:rotate(var(--r));animation:stickerIn .45s var(--d) cubic-bezier(.3,1.5,.5,1) both}
.stk2 .px{width:24px;height:24px}
@keyframes stickerIn{from{opacity:0;transform:scale(.4) rotate(0)}}
.donev .mission{animation:enterUp .4s .9s both}
.meter .bar{background:none;border:0;padding:0;box-shadow:none;border-radius:0;min-width:0}
.bar small{font-size:10px;letter-spacing:-.01em;overflow:visible}
.bar i{height:var(--h)!important;flex:none}
.bar{height:140px}
.hface{width:120px;height:120px}
.heat{padding:var(--s5) var(--s4)}
.hface,.heat .lvl,.heat .desc{position:relative;z-index:1}
.flames{z-index:0}
.sunwrap{margin-bottom:var(--s6)}
/* mobile top/bottom fit */
.ob.donev{min-height:100%;padding-top:calc(var(--s16) + env(safe-area-inset-top,0px));overflow:hidden}
.donev .sunwrap{width:176px;height:176px}
.donev .sunburst{inset:-16px}
.donev .badgeRing{width:144px;height:144px}
.ob-top{padding-top:env(safe-area-inset-top,0px);height:calc(72px + env(safe-area-inset-top,0px))}
.ctabar{padding-bottom:calc(var(--s4) + env(safe-area-inset-bottom,0px))}
/* spice slider */
.hs{margin-top:var(--s6);padding:var(--s5) var(--s5) var(--s4);border-radius:var(--r-lg);background:var(--surface);outline:none}
.hs-rail{position:relative;height:48px;touch-action:none;cursor:grab}
.hs.drag .hs-rail{cursor:grabbing}
.hs-track{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:var(--r-full);background:var(--surface-2)}
.hs-fill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);background:linear-gradient(90deg,#7BC74D,#F5B82E 30%,#FF8A00 55%,#FF4F2E 78%,#C2185B);background-size:calc(100vw - 80px) 100%;transition:width .3s cubic-bezier(.3,1.3,.5,1)}
.hs-tick{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#D4D4D8;box-shadow:0 0 0 2px var(--surface);transition:background .2s}
.hs-tick.on{background:#fff}
.hs-thumb{position:absolute;top:0;width:48px;height:48px;margin-left:-24px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--c),0 8px 20px rgba(9,9,11,.16);transition:left .3s cubic-bezier(.3,1.3,.5,1),box-shadow .2s,transform .15s}
.hs.drag .hs-thumb{transform:scale(1.15);box-shadow:0 0 0 4px var(--c),0 12px 28px rgba(9,9,11,.2)}
.hs-bub{display:grid;place-items:center}.hs-bub .px{width:32px;height:32px}
.hs-bub.boing{animation:boing .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(.6) rotate(-20deg)}100%{transform:none}}
.hs-labels{position:relative;height:20px;margin-top:var(--s3)}
.hs-labels button{position:absolute;transform:translateX(-50%);padding:0;border:0;background:none;font:600 11px/16px var(--font-ui);color:var(--mute);white-space:nowrap;transition:color .2s,transform .2s}
.hs-labels button:first-child{transform:none}.hs-labels button:last-child{transform:translateX(-100%)}
.hs-labels button.sel{color:var(--ink)}
/* turf left */
.sec-l2{margin:var(--s6) 0 var(--s3);font-size:13px;line-height:20px;font-weight:600;color:var(--mute)}
.turfv .turf{justify-content:flex-start}
/* done detailing */
.orbit{position:absolute;inset:-8px;animation:spin 6s linear infinite;pointer-events:none}
.orbit i{position:absolute;left:50%;top:50%;font-style:normal;color:#FF3E9A;font-size:18px;transform:rotate(var(--a)) translateY(-104px) rotate(calc(-1 * var(--a)));animation:twinkle 1.2s calc(var(--a)/360deg * 1s) ease-in-out infinite}
.orbit i:nth-child(even){color:#8B5CF6;font-size:13px}
@keyframes twinkle{50%{opacity:.25;scale:.6}}
.donev .badgeRing{padding:0;border:0;cursor:pointer;z-index:1}
.badgeRing.boop{animation:boop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes boop{0%{transform:scale(1)}30%{transform:scale(.85,1.12)}60%{transform:scale(1.12,.9) translateY(-8px)}100%{transform:none}}
.sunwrap .hi{position:absolute;right:-16px;top:12px;z-index:2;padding:var(--s1) var(--s3);border-radius:var(--r-full);background:var(--p1);color:#fff;font-size:12px;line-height:16px;font-weight:600;transform:rotate(8deg);animation:stickerIn .4s 1.6s cubic-bezier(.3,1.5,.5,1) both}
.sunwrap .hi.say{animation:stickerIn .3s cubic-bezier(.3,1.5,.5,1)}
.wave span{display:inline-block;animation:waveIn .5s calc(.3s + var(--i)*.07s) cubic-bezier(.3,1.5,.5,1) both}
@keyframes waveIn{from{opacity:0;transform:translateY(20px) rotate(6deg)}}
.donev h1{animation:none}
.tt.shine{position:relative;overflow:hidden}
.tt.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.6s 1.2s ease-in-out infinite}
@keyframes shine{0%{left:-60%}40%,100%{left:130%}}
.stk2{border:0;cursor:pointer;font-family:var(--font-ui);color:var(--ink)}
.stk2.wig{animation:wig .45s}
@keyframes wig{20%{transform:rotate(calc(var(--r) - 8deg)) scale(1.08)}50%{transform:rotate(calc(var(--r) + 6deg))}80%{transform:rotate(calc(var(--r) - 3deg))}100%{transform:rotate(var(--r))}}
.bigbtn.sweep{position:relative;overflow:hidden}
.bigbtn.sweep::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);animation:shine 3s 2s ease-in-out infinite}
/* ===== app v3: matches onboarding ===== */
/* nav */
#nav{left:50%;right:auto;width:min(calc(100% - 2 * var(--s4)),420px);transform:translateX(-50%);height:auto;display:block;bottom:calc(var(--s4) + env(safe-area-inset-bottom,0px))}
.nbar{display:flex;align-items:center;gap:var(--s1);padding:var(--s2);border-radius:28px;background:var(--p1);box-shadow:0 16px 40px rgba(9,9,11,.28)}
.nbar button[data-p]{flex:1;min-width:0;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:20px;color:#71717A;transition:background .2s,color .2s}
.nbar .ni{width:28px;height:28px;display:grid;place-items:center;opacity:.45;filter:grayscale(1);transition:opacity .2s,filter .2s,transform .2s}
.nbar .ni .px{width:28px;height:28px}
.nbar .nav-av{border-radius:50%;overflow:hidden;background:#27272A}
.nbar .nav-av .avimg{width:100%;height:100%}
.nbar .nl{font-size:11px;line-height:14px;font-weight:600}
.nbar button.on{background:rgba(255,255,255,.12);color:#fff}
.nbar button.on .ni{opacity:1;filter:none}
.nbar button.on .nav-av{box-shadow:0 0 0 2px #fff}
.nbar button[data-p]:active .ni{transform:scale(.88)}
.nbar .hop2 .ni{animation:hopIc .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hopIc{40%{transform:translateY(-6px) scale(1.1)}}
